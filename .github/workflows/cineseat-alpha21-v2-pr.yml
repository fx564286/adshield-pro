name: Cineseat Alpha21 Stable Watch V2

on:
  pull_request:
    branches: [cineseat-secure-builder]

permissions:
  contents: read
  actions: write

jobs:
  build:
    if: github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build and verify Cineseat alpha21
        shell: bash
        run: bash secure_payload/build_alpha21_public.sh

      - name: Upload alpha21 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha21-stable-v2-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
