name: Cineseat Alpha22 Seat UI

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA22_BUILD_TRIGGER.txt'
      - 'secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part*'
      - '.github/workflows/cineseat-alpha22-seat-ui.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha22-seat-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Prepare alpha22 protected stable builder
        shell: bash
        run: |
          set -euo pipefail
          cat secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part* > /tmp/alpha22-patch.b64
          base64 --decode /tmp/alpha22-patch.b64 \
            | gzip --decompress > secure_payload/apply_alpha22_seat_ui_fix.py
          echo '7fc4ff786f9609919c57dc018f951af82420c26a899ad683767f3aa3d5d1e024  secure_payload/apply_alpha22_seat_ui_fix.py' | sha256sum -c -
          python3 -m py_compile secure_payload/apply_alpha22_seat_ui_fix.py
          python3 - <<'PY'
          from pathlib import Path

          source = Path('secure_payload/build_alpha21_overlay_v2_public.sh')
          wrapper = source.read_text(encoding='utf-8')

          addon_anchor = 'rm -f "$SOURCE/payload/test/alpha20_runtime_test.dart"\n'
          if addon_anchor not in wrapper:
              raise SystemExit('stable home addon anchor missing')
          wrapper = wrapper.replace(
              addon_anchor,
              addon_anchor +
              'python3 secure_payload/apply_alpha22_seat_ui_fix.py "$SOURCE/payload"\n',
              1,
          )

          text_anchor = "text = source.read_text(encoding='utf-8')\n"
          if text_anchor not in wrapper:
              raise SystemExit('underlying builder text anchor missing')
          wrapper = wrapper.replace(
              text_anchor,
              text_anchor +
              "text = text.replace('0.2.1-alpha.21', '0.2.1-alpha.22')\n" +
              "text = text.replace('version: 0.2.1-alpha.22+41', 'version: 0.2.1-alpha.22+42')\n" +
              "text = text.replace('--build-number=41', '--build-number=42')\n" +
              "text = text.replace(\"versionCode='41'\", \"versionCode='42'\")\n" +
              "text = text.replace('Cineseat 0.2.1-alpha.21 validation build', 'Cineseat 0.2.1-alpha.22 validation build')\n",
              1,
          )
          wrapper = wrapper.replace(
              '/tmp/build_alpha21_overlay_v2_public.sh',
              '/tmp/build_alpha22_overlay_v2_public.sh',
          )
          Path('/tmp/run_alpha22_stable.sh').write_text(wrapper, encoding='utf-8')
          PY
          chmod +x /tmp/run_alpha22_stable.sh

      - name: Build and verify Cineseat alpha22
        shell: bash
        run: bash /tmp/run_alpha22_stable.sh

      - name: Verify alpha22 report tokens
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode='42'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.22'" dist/APK-PACKAGE-INFO.txt
          test -s dist/cineseat-0.2.1-alpha.22-VALIDATION.apk
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - Megabox timetable session cookie + JSON body seat request
          - one stable watch condition card without duplicate editors
          - available and occupied seats selectable for cancellation watch
          - 36px seat cells, pinch zoom/pan and long-press magnifier
          - selected seat summary and official reservation handoff
          - alpha19 stable WatchWizard home entry restored before alpha22 patch
          REPORT

      - name: Upload alpha22 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha22-seat-ui-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
