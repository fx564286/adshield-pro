name: Temporary Huawei Health QA APK Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'huawei_health_qa_build/**'
      - '.github/workflows/build-huawei-health-qa-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.head_ref == 'chatgpt-huawei-health-qa-apk-20260808' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Restore QA project
        shell: bash
        run: |
          base64 -d huawei_health_qa_build/HuaweiHealthQATool_source.zip.b64 > /tmp/HuaweiHealthQATool_source.zip
          rm -rf HuaweiHealthQATool
          unzip -q /tmp/HuaweiHealthQATool_source.zip
          sed -i 's/^HUAWEI_APP_ID=.*/HUAWEI_APP_ID=000000000000000/' HuaweiHealthQATool/gradle.properties
      - name: Build debug APK
        working-directory: HuaweiHealthQATool
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp HuaweiHealthQATool/app/build/outputs/apk/debug/app-debug.apk dist/HuaweiHealthQATool-debug.apk
          sha256sum dist/HuaweiHealthQATool-debug.apk | tee dist/HuaweiHealthQATool-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HuaweiHealthQATool-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
