name: video-distributed-quality-probe
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-distributed-quality-probe.yml'
      - 'video_toolchain/distributed/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  architecture-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build stable-diffusion.cpp RPC client
        shell: bash
        run: |
          set -euxo pipefail
          nproc | tee cpus.txt
          free -h | tee memory.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ git
          git clone --filter=blob:none --no-checkout https://github.com/leejet/stable-diffusion.cpp.git sd-src
          cd sd-src
          git checkout de298c225bed97c3f9026b73cd7b71e7879bd41b
          git submodule update --init --recursive ggml
          HASH=$(cat ggml/scripts/sync-llama.last)
          echo "$HASH" | tee ../llama-compatible-commit.txt
          cmake -S . -B build-rpc -G Ninja -DSD_RPC=ON -DSD_BUILD_EXAMPLES=ON -DSD_WEBP=OFF -DSD_WEBM=OFF -DSD_BUILD_SHARED_LIBS=OFF
          cmake --build build-rpc --target sd-cli -j "$(nproc)"
          CLIENT=$(find build-rpc -type f -name 'sd-cli' | head -n1)
          test -n "$CLIENT"
          echo "$PWD/$CLIENT" | tee ../rpc-client-path.txt

      - name: Build compatible RPC server
        shell: bash
        run: |
          set -euxo pipefail
          HASH=$(cat llama-compatible-commit.txt)
          mkdir llama-src && cd llama-src
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin "$HASH"
          git checkout -q FETCH_HEAD
          cmake -S . -B build -G Ninja -DGGML_RPC=ON -DGGML_BUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DCMAKE_C_FLAGS=-DGGML_MAX_NAME=128 -DCMAKE_CXX_FLAGS=-DGGML_MAX_NAME=128
          cmake --build build --target ggml-rpc-server -j "$(nproc)"
          RPC=$(find build -type f -name 'ggml-rpc-server' | head -n1)
          test -n "$RPC"
          echo "$PWD/$RPC" | tee ../rpc-server-path.txt

      - name: Restore verified VACE model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: vace-1.3b-fp16-umt5-q3ks-vae-v1

      - name: Verify models and input
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.model-cache.outputs.cache-hit }}" = true
          echo '640ccc0577e6a5d4bb15cd91b11b699ef914fc55f126c5a1c544e152130784f2  models/vace-fp16.safetensors' | sha256sum -c -
          echo 'f64f8d6dc4d8a24276df69d0ccea789aae686f7417950a41e6568c30cb478a5c  models/umt5-q3ks.gguf' | sha256sum -c -
          echo '2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b  models/wan-vae.safetensors' | sha256sum -c -
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/leejet/stable-diffusion.cpp/master/assets/cat_with_sd_cpp_42.png' -o source.png

      - name: Real VACE diffusion offload to RPC registry
        shell: bash
        run: |
          set -euxo pipefail
          RPC=$(cat rpc-server-path.txt)
          export LD_LIBRARY_PATH="$(dirname "$RPC")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$RPC" --host 127.0.0.1 --port 50052 > rpc-server.log 2>&1 &
          RPC_PID=$!
          trap 'kill $RPC_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            kill -0 "$RPC_PID" 2>/dev/null || { cat rpc-server.log; exit 1; }
            if bash -c '</dev/tcp/127.0.0.1/50052' 2>/dev/null; then break; fi
            sleep 1
          done
          CLIENT=$(cat rpc-client-path.txt)
          set +e
          /usr/bin/time -v "$CLIENT" \
            -M vid_gen \
            --rpc-servers 127.0.0.1:50052 \
            --backend 'diffusion=RPC,te=CPU,vae=CPU' \
            --params-backend 'diffusion=RPC,te=CPU,vae=CPU' \
            --diffusion-model models/vace-fp16.safetensors \
            --vae models/wan-vae.safetensors \
            --t5xxl models/umt5-q3ks.gguf \
            -i source.png \
            -p 'a subject moving naturally' \
            -n 'deformed, duplicate limbs, blurry' \
            --cfg-scale 1.0 --sampling-method euler --steps 1 --flow-shift 3.0 \
            --video-frames 5 --fps 4 --mmap --vae-tiling -t 4 -W 128 -H 128 \
            -o rpc-vace-smoke.avi -v > rpc-client.log 2>&1
          RC=$?
          set -e
          cat rpc-client.log
          cat rpc-server.log
          echo "RPC_VACE_EXIT=$RC" | tee rpc-connect-report.txt
          test "$RC" -eq 0
          test -s rpc-vace-smoke.avi
          grep -Eqi 'RPC|127\.0\.0\.1:50052' rpc-client.log
          grep -Eqi 'Accepted client connection|alloc|buffer|tensor|graph' rpc-server.log
          printf 'RPC_SERVER_PORT=OPEN\nRPC_REGISTRY_RESOLVE=PASS\nRPC_REAL_MODEL_OFFLOAD=PASS\nRPC_VACE_GENERATION=PASS\nCHATGPT_PER_FRAME_INFERENCE=NO\nEXTERNAL_MCP_INFERENCE=NO\n' | tee -a rpc-connect-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-capability-probe
          path: |
            cpus.txt
            memory.txt
            llama-compatible-commit.txt
            rpc-client-path.txt
            rpc-server-path.txt
            rpc-server.log
            rpc-client.log
            rpc-connect-report.txt
            rpc-vace-smoke.avi
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
