name: video-distributed-quality-probe
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-distributed-quality-probe.yml'
      - 'video_toolchain/distributed/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Direct compute only. No ChatGPT/MCP per-frame inference.

jobs:
  architecture-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Build stable-diffusion.cpp RPC client
        shell: bash
        run: |
          set -euxo pipefail
          nproc | tee cpus.txt
          free -h | tee memory.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ git
          git clone --filter=blob:none --no-checkout https://github.com/leejet/stable-diffusion.cpp.git sd-src
          cd sd-src
          git checkout de298c225bed97c3f9026b73cd7b71e7879bd41b
          git submodule update --init --recursive ggml
          HASH=$(cat ggml/scripts/sync-llama.last)
          echo "$HASH" | tee ../llama-compatible-commit.txt
          cmake -S . -B build-rpc -G Ninja \
            -DSD_RPC=ON \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DSD_BUILD_SHARED_LIBS=OFF
          cmake --build build-rpc --target sd-cli -j "$(nproc)"
          CLIENT=$(find build-rpc -type f -name 'sd-cli' | head -n1)
          test -n "$CLIENT"
          CLIENT_ABS="$PWD/$CLIENT"
          echo "$CLIENT_ABS" | tee ../rpc-client-path.txt
          "$CLIENT_ABS" -h > ../sd-cli-help.txt 2>&1
          grep -n -E 'rpc|backend|split|vid_gen|control-video' ../sd-cli-help.txt | tee ../distributed-capabilities.txt
          ldd "$CLIENT_ABS" | tee ../rpc-client-ldd.txt

      - name: Build API-compatible llama.cpp RPC server
        shell: bash
        run: |
          set -euxo pipefail
          HASH=$(cat llama-compatible-commit.txt)
          mkdir llama-src
          cd llama-src
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin "$HASH"
          git checkout -q FETCH_HEAD
          cmake -S . -B build -G Ninja \
            -DGGML_RPC=ON \
            -DGGML_BUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_C_FLAGS=-DGGML_MAX_NAME=128 \
            -DCMAKE_CXX_FLAGS=-DGGML_MAX_NAME=128
          cmake --build build --target ggml-rpc-server -j "$(nproc)"
          RPC=$(find build -type f -name 'ggml-rpc-server' | head -n1)
          test -n "$RPC"
          RPC_ABS="$PWD/$RPC"
          echo "$RPC_ABS" | tee ../rpc-server-path.txt
          ldd "$RPC_ABS" | tee ../rpc-server-ldd.txt
          file "$RPC_ABS" | tee ../rpc-server-file.txt
          sha256sum "$RPC_ABS" | tee ../rpc-server.sha256

      - name: Real localhost RPC device registration smoke
        shell: bash
        run: |
          set -euxo pipefail
          RPC=$(cat rpc-server-path.txt)
          RPC_DIR=$(dirname "$RPC")
          export LD_LIBRARY_PATH="$RPC_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$RPC" --host 127.0.0.1 --port 50052 > rpc-server.log 2>&1 &
          RPC_PID=$!
          trap 'kill $RPC_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do
            if ! kill -0 "$RPC_PID" 2>/dev/null; then
              cat rpc-server.log || true
              exit 1
            fi
            if bash -c '</dev/tcp/127.0.0.1/50052' 2>/dev/null; then break; fi
            sleep 1
          done
          CLIENT=$(cat rpc-client-path.txt)
          "$CLIENT" --list-devices > local-devices.txt 2>&1
          "$CLIENT" --rpc-servers 127.0.0.1:50052 --list-devices > rpc-devices.txt 2>&1
          cat rpc-server.log || true
          echo '--- LOCAL ---'
          cat local-devices.txt
          echo '--- WITH RPC ---'
          cat rpc-devices.txt
          grep -E '^RPC[0-9]+' rpc-devices.txt
          printf 'RPC_SERVER_PORT=OPEN\nRPC_LOCALHOST_CONNECT=PASS\nRPC_DEVICE_REGISTERED=PASS\nCHATGPT_PER_FRAME_INFERENCE=NO\nEXTERNAL_MCP_INFERENCE=NO\n' | tee rpc-connect-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-capability-probe
          path: |
            cpus.txt
            memory.txt
            llama-compatible-commit.txt
            rpc-client-path.txt
            rpc-client-ldd.txt
            sd-cli-help.txt
            distributed-capabilities.txt
            rpc-server-path.txt
            rpc-server-ldd.txt
            rpc-server-file.txt
            rpc-server.sha256
            rpc-server.log
            local-devices.txt
            rpc-devices.txt
            rpc-connect-report.txt
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

  parallel-worker-probe:
    if: ${{ contains(github.event.head_commit.message, '[PARALLEL-PROBE]') }}
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Worker resource + deterministic candidate contract
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          {
            echo "WORKER=${{ matrix.worker }}"
            echo "CPUS=$(nproc)"
            free -b | awk '/Mem:/ {print "MEM_BYTES="$2}'
            echo "SEED=$((42000 + ${{ matrix.worker }}))"
            echo 'ROLE=independent_candidate_render'
            echo 'CHATGPT_PER_FRAME_INFERENCE=NO'
            echo 'EXTERNAL_MCP_INFERENCE=NO'
          } | tee out/worker-${{ matrix.worker }}.txt
          sha256sum out/worker-${{ matrix.worker }}.txt > out/worker-${{ matrix.worker }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-worker-${{ matrix.worker }}
          path: out/
          retention-days: 3
