name: Cineseat Alpha27 Picker CGV

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA27_BUILD_TRIGGER.txt'
      - 'secure_payload/apply_alpha27_picker_cgv.py.gz.b64.part*'
      - '.github/workflows/cineseat-alpha27-picker-cgv.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha27-picker-cgv-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct stable and alpha27 patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part00 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part01 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part02 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03a \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03b \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part04 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part05 \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha22_seat_ui_fix.py
          cat secure_payload/apply_alpha23_ui_cache.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha23_ui_cache.py
          cat secure_payload/apply_alpha25_alpha19_region_condition.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha25_alpha19_region_condition.py
          cat secure_payload/apply_alpha26_unified_filters_seat_icon.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha26_unified_filters_seat_icon.py
          cat secure_payload/apply_alpha27_picker_cgv.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha27_picker_cgv.py
          echo '15812356f1ef0023c66d9d2b478d3418661d625d47bc8d97f75e3c49ea473307  secure_payload/apply_alpha26_unified_filters_seat_icon.py' | sha256sum -c -
          echo 'b54d536d8449987dc8227266b0c298c96cc5a646598b73e44d32a0d8bd1b5b51  secure_payload/apply_alpha27_picker_cgv.py' | sha256sum -c -
          python3 -m py_compile secure_payload/apply_alpha22_seat_ui_fix.py
          python3 -m py_compile secure_payload/apply_alpha22_booking_helper_fix.py
          python3 -m py_compile secure_payload/apply_alpha23_ui_cache.py
          python3 -m py_compile secure_payload/apply_alpha25_alpha19_region_condition.py
          python3 -m py_compile secure_payload/apply_alpha26_unified_filters_seat_icon.py
          python3 -m py_compile secure_payload/apply_alpha26_key_compat.py
          python3 -m py_compile secure_payload/apply_alpha27_picker_cgv.py

      - name: Prepare alpha27 stable builder wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('secure_payload/build_alpha21_overlay_v2_public.sh')
          wrapper = source.read_text(encoding='utf-8')
          addon_anchor = 'rm -f "$SOURCE/payload/test/alpha20_runtime_test.dart"\n'
          if addon_anchor not in wrapper:
              raise SystemExit('stable home addon anchor missing')
          wrapper = wrapper.replace(
              addon_anchor,
              addon_anchor +
              'python3 secure_payload/apply_alpha22_seat_ui_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha22_booking_helper_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha23_ui_cache.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha25_alpha19_region_condition.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha26_unified_filters_seat_icon.py "$SOURCE/payload"\n' +
              'printf "\\n// Cineseat 0.2.1-alpha.27\\n" >> "$SOURCE/payload/lib/wizard_v4.dart"\n',
              1,
          )

          after_polish_anchor = "PYFIX\n'''"
          if after_polish_anchor not in wrapper:
              raise SystemExit('region polish completion anchor missing')
          wrapper = wrapper.replace(
              after_polish_anchor,
              'PYFIX\n' +
              'python3 secure_payload/apply_alpha26_key_compat.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha27_picker_cgv.py "$SOURCE/payload"\n' +
              "'''",
              1,
          )

          text_anchor = "text = source.read_text(encoding='utf-8')\n"
          if text_anchor not in wrapper:
              raise SystemExit('underlying builder text anchor missing')
          wrapper = wrapper.replace(
              text_anchor,
              text_anchor +
              "text = text.replace('0.2.1-alpha.21', '0.2.1-alpha.27')\n" +
              "text = text.replace('version: 0.2.1-alpha.27+41', 'version: 0.2.1-alpha.27+47')\n" +
              "text = text.replace('--build-number=41', '--build-number=47')\n" +
              "text = text.replace(\"versionCode='41'\", \"versionCode='47'\")\n" +
              "text = text.replace('Cineseat 0.2.1-alpha.21 validation build', 'Cineseat 0.2.1-alpha.27 validation build')\n" +
              "text = text.replace(\"if '0.2.1-alpha.21' not in all_dart:\", \"if '0.2.1-alpha.27' not in all_dart:\")\n" +
              "text = text.replace('alpha21 version marker is missing', 'alpha27 version marker is missing')\n",
              1,
          )
          wrapper = wrapper.replace(
              '/tmp/build_alpha21_overlay_v2_public.sh',
              '/tmp/build_alpha27_overlay_v2_public.sh',
          )
          Path('/tmp/run_alpha27_stable.sh').write_text(wrapper, encoding='utf-8')
          PY
          chmod +x /tmp/run_alpha27_stable.sh

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build and verify Cineseat alpha27
        shell: bash
        run: bash /tmp/run_alpha27_stable.sh

      - name: Verify alpha27 update package
        shell: bash
        run: |
          set -euo pipefail
          grep -q "package: name='com.fx564286.cinema_seat_alert'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionCode='47'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.27'" dist/APK-PACKAGE-INFO.txt
          grep -q "85cd76bb3988145c2066cc712181dbbfd3a3c3068858e202c2830db92ce7c0d3" dist/APK-SIGNATURE.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/APK-SIGNATURE.txt
          test -s dist/cineseat-0.2.1-alpha.27-VALIDATION.apk
          unzip -tq dist/cineseat-0.2.1-alpha.27-VALIDATION.apk
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - theater selection changed to a two-pane left-region and right-theater picker
          - region switching and theater rows use restrained animated transitions
          - selected results are shown as full-width rounded theater cards
          - CGV exact seats are requested natively through the public non-member seat endpoint without app login
          - direct official CGV showtime URL and injected WebView context remain as a fallback
          - Lotte Cinema and Megabox exact-seat providers remain available
          - package id and fixed signing certificate match alpha26 for overwrite installation
          - versionCode increased from 46 to 47
          REPORT

      - name: Upload alpha27 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha27-picker-cgv-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
