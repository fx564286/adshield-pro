name: video-vace-ensemble
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-vace-ensemble.yml'
      - 'video_toolchain/distributed/render_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  MODEL_CACHE_KEY: vace-1.3b-fp16-umt5-q3ks-vae-v1
  ENSEMBLE_REVISION: '3'

jobs:
  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ENSEMBLE]') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - worker: 0
            seed: 42000
          - worker: 1
            seed: 42001
          - worker: 2
            seed: 42002
          - worker: 3
            seed: 42003
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Runtime + ffmpeg
        shell: bash
        run: |
          set -euxo pipefail
          echo "WORKER=${{ matrix.worker }} SEED=${{ matrix.seed }}"
          nproc
          free -h
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download stable-diffusion.cpp runtime
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-820-de298c2/sd-master-de298c2-bin-Linux-Ubuntu-24.04-x86_64.zip'
          curl -L --fail --retry 3 "$URL" -o sd.zip
          echo '7ecc39e2485ec871d127d004d2bac4c2640eea7d0235cb6b131a8006322e0ce3  sd.zip' | sha256sum -c -
          unzip -q sd.zip -d sd
          chmod +x sd/sd-cli
      - name: Restore VACE model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Require verified cached models
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.model-cache.outputs.cache-hit }}" = true
          echo '640ccc0577e6a5d4bb15cd91b11b699ef914fc55f126c5a1c544e152130784f2  models/vace-fp16.safetensors' | sha256sum -c -
          echo 'f64f8d6dc4d8a24276df69d0ccea789aae686f7417950a41e6568c30cb478a5c  models/umt5-q3ks.gguf' | sha256sum -c -
          echo '2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b  models/wan-vae.safetensors' | sha256sum -c -
      - name: Prepare exact 9 distinct full-body control frames
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/leejet/stable-diffusion.cpp/de298c225bed97c3f9026b73cd7b71e7879bd41b/assets/wan/Wan2.1_1.3B_vace_v2v.mp4' -o dance.mp4
          mkdir -p control
          ffmpeg -y -v error -i dance.mp4 -vf "select='not(mod(n,4))',scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black" -vsync 0 -frames:v 9 control/frame_%04d.png
          ffmpeg -y -v error -i dance.mp4 -vf 'select=eq(n\,0),scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black' -frames:v 1 source.png
          test "$(find control -name 'frame_*.png' | wc -l)" -eq 9
          test "$(sha256sum control/frame_*.png | awk '{print $1}' | sort -u | wc -l)" -eq 9
      - name: Real VACE candidate inference
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v sd/sd-cli \
            -M vid_gen \
            --diffusion-model models/vace-fp16.safetensors \
            --vae models/wan-vae.safetensors \
            --t5xxl models/umt5-q3ks.gguf \
            -i source.png \
            --control-video control \
            -p 'a young adult woman performing a natural energetic idol dance in a studio, coherent realistic full body, stable realistic face, anatomically correct arms legs and hands, consistent clothing, natural articulated movement' \
            -n 'static, deformed, duplicate limbs, extra arms, extra legs, extra fingers, broken hands, distorted face, ghosting, blurry, melting body, fused limbs' \
            --cfg-scale 6.0 \
            --sampling-method euler \
            --steps 6 \
            --flow-shift 3.0 \
            --video-frames 9 \
            --fps 4 \
            --seed ${{ matrix.seed }} \
            --offload-to-cpu \
            --mmap \
            --vae-tiling \
            --diffusion-fa \
            -t 4 \
            -W 288 -H 512 \
            -o candidate-${{ matrix.worker }}.avi \
            -v 2>&1 | tee candidate-${{ matrix.worker }}.log
          test -s candidate-${{ matrix.worker }}.avi
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json candidate-${{ matrix.worker }}.avi | tee candidate-${{ matrix.worker }}-ffprobe.json
          ffmpeg -y -v error -i candidate-${{ matrix.worker }}.avi -vf 'scale=216:384,tile=9x1' -frames:v 1 candidate-${{ matrix.worker }}-contact.png
          printf 'REAL_VACE_CANDIDATE=PASS\nWORKER=${{ matrix.worker }}\nSEED=${{ matrix.seed }}\nCHATGPT_PER_FRAME_INFERENCE=NO\nEXTERNAL_MCP_INFERENCE=NO\n' > candidate-${{ matrix.worker }}-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vace-candidate-${{ matrix.worker }}-seed-${{ matrix.seed }}
          path: |
            candidate-${{ matrix.worker }}.avi
            candidate-${{ matrix.worker }}.log
            candidate-${{ matrix.worker }}-ffprobe.json
            candidate-${{ matrix.worker }}-contact.png
            candidate-${{ matrix.worker }}-report.txt
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0

  structural-qa:
    needs: candidate
    if: ${{ always() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vace-candidate-*
          path: candidates
          merge-multiple: true
      - name: Install QA dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --break-system-packages 'mediapipe==0.10.21' opencv-python-headless numpy
      - name: Rank candidates by body topology and temporal coherence
        shell: bash
        run: |
          set -euxo pipefail
          cat > qa.py <<'PY'
          import cv2, glob, json, math, os
          import numpy as np
          import mediapipe as mp

          pose_cls = mp.solutions.pose.Pose
          required = [11,12,13,14,15,16,23,24,25,26,27,28]
          rows=[]
          for avi in sorted(glob.glob('candidates/candidate-*.avi')):
              cap=cv2.VideoCapture(avi)
              frames=[]
              while True:
                  ok, fr=cap.read()
                  if not ok: break
                  frames.append(fr)
              cap.release()
              detections=[]; centers=[]; sharp=[]; visibility=[]
              with pose_cls(static_image_mode=True, model_complexity=1,
                            enable_segmentation=False,
                            min_detection_confidence=0.35) as pose:
                  for fr in frames:
                      sharp.append(float(cv2.Laplacian(cv2.cvtColor(fr,cv2.COLOR_BGR2GRAY),cv2.CV_64F).var()))
                      res=pose.process(cv2.cvtColor(fr,cv2.COLOR_BGR2RGB))
                      if not res.pose_landmarks:
                          detections.append(0); centers.append(None); visibility.append(0.0); continue
                      lm=res.pose_landmarks.landmark
                      vis=float(np.mean([lm[i].visibility for i in required]))
                      visibility.append(vis)
                      good=sum(lm[i].visibility>=0.35 for i in required)
                      detections.append(1 if good>=10 else 0)
                      centers.append((float((lm[23].x+lm[24].x)/2),float((lm[23].y+lm[24].y)/2)))
              jumps=[]
              for a,b in zip(centers,centers[1:]):
                  if a is not None and b is not None:
                      jumps.append(math.hypot(a[0]-b[0],a[1]-b[1]))
              pose_rate=sum(detections)/max(1,len(frames))
              mean_vis=float(np.mean(visibility)) if visibility else 0.0
              mean_jump=float(np.mean(jumps)) if jumps else 1.0
              sharpness=float(np.mean(sharp)) if sharp else 0.0
              # Structural score: body recoverability dominates; smooth but non-static motion gets a smaller term.
              continuity=max(0.0,1.0-min(mean_jump/0.25,1.0))
              sharp_norm=min(sharpness/300.0,1.0)
              score=0.55*pose_rate+0.25*mean_vis+0.15*continuity+0.05*sharp_norm
              rows.append({'file':os.path.basename(avi),'frames':len(frames),'pose_rate':pose_rate,
                           'mean_required_visibility':mean_vis,'mean_hip_jump':mean_jump,
                           'sharpness':sharpness,'structural_score':score})
          rows.sort(key=lambda x:x['structural_score'], reverse=True)
          with open('qa-ranking.json','w') as f: json.dump(rows,f,indent=2)
          if not rows: raise SystemExit('no candidate videos')
          best=rows[0]
          with open('qa-report.txt','w') as f:
              f.write(f"BEST_CANDIDATE={best['file']}\n")
              f.write(f"BEST_STRUCTURAL_SCORE={best['structural_score']:.6f}\n")
              f.write(f"BEST_POSE_RATE={best['pose_rate']:.6f}\n")
              f.write('MANUAL_VISUAL_GATE_REQUIRED=YES\n')
              f.write('AUTOMATIC_QA_IS_NOT_FINAL_VISUAL_PASS=YES\n')
          print(json.dumps(rows,indent=2))
          if best['pose_rate'] < 0.67:
              raise SystemExit('all candidates fail minimum full-body pose recoverability')
          PY
          python3 qa.py
          cat qa-report.txt
          BEST=$(awk -F= '/BEST_CANDIDATE=/{print $2}' qa-report.txt)
          cp "candidates/$BEST" best-structural-candidate.avi
          ffmpeg -y -v error -i best-structural-candidate.avi -vf 'scale=216:384,tile=9x1' -frames:v 1 best-contact.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vace-ensemble-structural-qa
          path: |
            qa-ranking.json
            qa-report.txt
            best-structural-candidate.avi
            best-contact.png
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
