name: video-pose-control
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-pose-control.yml'
      - 'video_toolchain/motion_sources.json'
  workflow_dispatch:

env:
  POSE_REVISION: '2'

jobs:
  pose-control:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[POSE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --break-system-packages mediapipe opencv-python-headless numpy

      - name: Download and extract 41 real motion frames
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20woman%20on%20dancing%20floor.webm' -o source.webm
          mkdir -p rgb41
          ffmpeg -y -v error -ss 5 -i source.webm \
            -vf 'fps=4,scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black' \
            -frames:v 41 rgb41/frame_%04d.png
          test "$(find rgb41 -name 'frame_*.png' | wc -l)" -eq 41

      - name: Extract isolated pose skeleton sequence
        shell: bash
        run: |
          set -euxo pipefail
          cat > extract_pose.py <<'PY'
          import cv2, glob, json, os
          import numpy as np
          import mediapipe as mp
          Pose = mp.solutions.pose.Pose
          CONN = list(mp.solutions.pose.POSE_CONNECTIONS)
          files = sorted(glob.glob('rgb41/frame_*.png'))
          os.makedirs('pose41', exist_ok=True)
          report=[]; ok=0
          with Pose(static_image_mode=True, model_complexity=2,
                    enable_segmentation=False,
                    min_detection_confidence=0.45) as pose:
              for idx, path in enumerate(files,1):
                  bgr=cv2.imread(path); h,w=bgr.shape[:2]
                  x0=int(w*0.12); x1=int(w*0.88)
                  crop=bgr[:,x0:x1]
                  res=pose.process(cv2.cvtColor(crop, cv2.COLOR_BGR2RGB))
                  canvas=np.zeros((h,w,3),np.uint8); accepted=False; pts=[]
                  if res.pose_landmarks:
                      for lm in res.pose_landmarks.landmark:
                          pts.append((x0+lm.x*(x1-x0), lm.y*h, lm.visibility))
                      ids=[11,12,23,24,25,26]
                      score=float(np.mean([pts[i][2] for i in ids]))
                      if score>=0.35:
                          accepted=True; ok+=1
                          for a,b in CONN:
                              xa,ya,va=pts[a]; xb,yb,vb=pts[b]
                              if min(va,vb)>=0.20:
                                  cv2.line(canvas,(int(xa),int(ya)),(int(xb),int(yb)),(255,255,255),3,cv2.LINE_AA)
                          for x,y,v in pts:
                              if v>=0.20: cv2.circle(canvas,(int(x),int(y)),4,(255,255,255),-1,cv2.LINE_AA)
                  cv2.imwrite(f'pose41/frame_{idx:04d}.png',canvas)
                  report.append({'frame':idx,'pose_detected':accepted})
          with open('pose-detection.json','w') as f: json.dump(report,f,indent=2)
          with open('pose-report.txt','w') as f:
              f.write(f'POSE_DETECTED={ok}/41\nRGB_BACKGROUND_REMOVED=YES\nDUPLICATED_POSE_FRAMES_INSERTED=NO\n')
          if ok < 36: raise SystemExit(f'pose detection too weak: {ok}/41')
          PY
          python3 extract_pose.py
          cat pose-report.txt
          test "$(find pose41 -name 'frame_*.png' | wc -l)" -eq 41

      - name: Split A/B with one-frame overlap and create previews
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p poseA poseB
          for src in $(seq 1 21); do printf -v s '%04d' "$src"; cp "pose41/frame_${s}.png" "poseA/frame_${s}.png"; done
          i=1
          for src in $(seq 21 41); do
            printf -v s '%04d' "$src"; printf -v d '%04d' "$i"
            cp "pose41/frame_${s}.png" "poseB/frame_${d}.png"; i=$((i+1))
          done
          cmp poseA/frame_0021.png poseB/frame_0001.png
          ffmpeg -y -v error -framerate 4 -i pose41/frame_%04d.png -vf 'scale=144:256,tile=7x6' -frames:v 1 pose-contact.png
          ffmpeg -y -v error -framerate 4 -i pose41/frame_%04d.png -c:v libx264 -pix_fmt yuv420p pose-control-10s.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: isolated-real-human-pose-control
          path: |
            pose-report.txt
            pose-detection.json
            pose-contact.png
            pose-control-10s.mp4
            poseA/
            poseB/
          retention-days: 3
          compression-level: 0
