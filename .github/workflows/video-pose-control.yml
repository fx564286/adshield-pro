name: video-pose-control
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-pose-control.yml'
      - 'video_toolchain/motion_sources.json'
  workflow_dispatch:

env:
  POSE_REVISION: '4'

jobs:
  pose-control:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[POSE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --break-system-packages 'mediapipe==0.10.21' opencv-python-headless numpy
          python3 - <<'PY'
          import mediapipe as mp
          assert hasattr(mp, 'solutions') and hasattr(mp.solutions, 'pose')
          print('MEDIAPIPE_SOLUTIONS_API=PASS', mp.__version__)
          PY

      - name: Download and extract 41 real motion frames
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20woman%20on%20dancing%20floor.webm' -o source.webm
          mkdir -p rgb41
          ffmpeg -y -v error -ss 5 -i source.webm \
            -vf 'fps=4,scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black' \
            -frames:v 41 rgb41/frame_%04d.png
          test "$(find rgb41 -name 'frame_*.png' | wc -l)" -eq 41

      - name: Extract and complete isolated pose trajectory
        shell: bash
        run: |
          set -euxo pipefail
          cat > extract_pose.py <<'PY'
          import cv2, glob, json, os
          import numpy as np
          import mediapipe as mp

          Pose = mp.solutions.pose.Pose
          CONN = list(mp.solutions.pose.POSE_CONNECTIONS)
          files = sorted(glob.glob('rgb41/frame_*.png'))
          os.makedirs('pose41', exist_ok=True)
          raw=[]; raw_ok=[]
          with Pose(static_image_mode=True, model_complexity=2,
                    enable_segmentation=False,
                    min_detection_confidence=0.45) as pose:
              for idx,path in enumerate(files):
                  bgr=cv2.imread(path); h,w=bgr.shape[:2]
                  x0=int(w*0.12); x1=int(w*0.88)
                  crop=bgr[:,x0:x1]
                  res=pose.process(cv2.cvtColor(crop,cv2.COLOR_BGR2RGB))
                  pts=None
                  if res.pose_landmarks:
                      p=np.array([[x0+lm.x*(x1-x0), lm.y*h, lm.visibility] for lm in res.pose_landmarks.landmark],dtype=np.float32)
                      ids=[11,12,23,24,25,26]
                      if float(np.mean(p[ids,2]))>=0.35:
                          pts=p
                  raw.append(pts); raw_ok.append(pts is not None)

          detected=[i for i,p in enumerate(raw) if p is not None]
          if len(detected)<28:
              raise SystemExit(f'raw pose detection unusable: {len(detected)}/41')

          completed=list(raw)
          interpolated=[]
          for i,p in enumerate(completed):
              if p is not None: continue
              left=max((j for j in detected if j<i), default=None)
              right=min((j for j in detected if j>i), default=None)
              if left is None or right is None:
                  raise SystemExit(f'cannot safely interpolate edge frame {i+1}')
              # Only interpolate bounded occlusions. Long gaps would hide too much real motion.
              if right-left>4:
                  raise SystemExit(f'occlusion gap too long around frame {i+1}: {right-left-1} missing frames')
              a=(i-left)/(right-left)
              q=(1.0-a)*raw[left]+a*raw[right]
              q[:,2]=np.minimum(raw[left][:,2],raw[right][:,2])
              completed[i]=q.astype(np.float32)
              interpolated.append(i)

          def draw(p,h=512,w=288):
              canvas=np.zeros((h,w,3),np.uint8)
              for a,b in CONN:
                  xa,ya,va=p[a]; xb,yb,vb=p[b]
                  if min(va,vb)>=0.12:
                      cv2.line(canvas,(int(xa),int(ya)),(int(xb),int(yb)),(255,255,255),3,cv2.LINE_AA)
              for x,y,v in p:
                  if v>=0.12:
                      cv2.circle(canvas,(int(x),int(y)),4,(255,255,255),-1,cv2.LINE_AA)
              return canvas

          report=[]
          for i,p in enumerate(completed):
              cv2.imwrite(f'pose41/frame_{i+1:04d}.png',draw(p))
              report.append({'frame':i+1,'raw_pose_detected':bool(raw_ok[i]),'control_interpolated':i in interpolated})
          with open('pose-detection.json','w') as f: json.dump(report,f,indent=2)
          np.savez_compressed('pose-landmarks.npz',*completed)
          with open('pose-report.txt','w') as f:
              f.write(f'RAW_POSE_DETECTED={sum(raw_ok)}/41\n')
              f.write(f'INTERPOLATED_CONTROL_FRAMES={len(interpolated)}/41\n')
              f.write('CONTROL_COMPLETE=41/41\n')
              f.write('RGB_BACKGROUND_REMOVED=YES\n')
              f.write('DUPLICATED_CONTROL_FRAMES_INSERTED=NO\n')
              f.write('FINAL_GENERATIVE_FRAMES_INTERPOLATED=NO\n')
              f.write('INTERPOLATION_SCOPE=POSE_CONTROL_LANDMARKS_ONLY\n')
          print(open('pose-report.txt').read())
          PY
          python3 extract_pose.py
          cat pose-report.txt
          test "$(find pose41 -name 'frame_*.png' | wc -l)" -eq 41
          test "$(sha256sum pose41/frame_*.png | awk '{print $1}' | sort -u | wc -l)" -eq 41

      - name: Split A/B with one-frame overlap and create previews
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p poseA poseB
          for src in $(seq 1 21); do printf -v s '%04d' "$src"; cp "pose41/frame_${s}.png" "poseA/frame_${s}.png"; done
          i=1
          for src in $(seq 21 41); do
            printf -v s '%04d' "$src"; printf -v d '%04d' "$i"
            cp "pose41/frame_${s}.png" "poseB/frame_${d}.png"; i=$((i+1))
          done
          cmp poseA/frame_0021.png poseB/frame_0001.png
          ffmpeg -y -v error -framerate 4 -i pose41/frame_%04d.png -vf 'scale=144:256,tile=7x6' -frames:v 1 pose-contact.png
          ffmpeg -y -v error -framerate 4 -i pose41/frame_%04d.png -c:v libx264 -pix_fmt yuv420p pose-control-10s.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-real-human-pose-control
          path: |
            pose-report.txt
            pose-detection.json
            pose-landmarks.npz
            pose-contact.png
            pose-control-10s.mp4
            pose41/
            poseA/
            poseB/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
