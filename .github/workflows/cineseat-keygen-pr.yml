name: Cineseat Secure Alpha20 PR Build

on:
  pull_request:
    branches: [cineseat-secure-builder]

permissions:
  contents: read
  actions: write

jobs:
  secure-build:
    if: github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Detect encrypted payload
        id: payload
        shell: bash
        run: |
          if [[ -s secure_payload/source.enc.b64.part01 && \
                -s secure_payload/source.enc.b64.part10 && \
                -s secure_payload/key.enc.b64 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore one-time private key
        id: key-cache
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1

      - name: Validate one-time key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secure_runtime
          if [[ "${{ steps.payload.outputs.present }}" == 'true' ]]; then
            test -s secure_runtime/private.pem || {
              echo 'Encrypted payload exists but its one-time private key cache is unavailable.' >&2
              exit 1
            }
          elif [[ ! -s secure_runtime/private.pem ]]; then
            openssl genpkey -algorithm RSA \
              -pkeyopt rsa_keygen_bits:4096 \
              -out secure_runtime/private.pem
            chmod 600 secure_runtime/private.pem
          fi
          openssl pkey -in secure_runtime/private.pem -pubout \
            -out secure_runtime/public.pem

      - name: Upload encryption public key
        if: steps.payload.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-secure-public-key-pr-${{ github.run_number }}
          path: secure_runtime/public.pem
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-java@v4
        if: steps.payload.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.payload.outputs.present == 'true'
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Decrypt source only inside runner
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode secure_payload/key.enc.b64 > secure_runtime/key.enc
          openssl pkeyutl -decrypt \
            -inkey secure_runtime/private.pem \
            -in secure_runtime/key.enc \
            -out secure_runtime/aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          cat secure_payload/source.enc.b64.part* \
            | base64 --decode > secure_runtime/source.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secure_runtime/source.enc \
            -out secure_runtime/source.tar.gz \
            -pass file:secure_runtime/aes.key
          mkdir -p secure_runtime/source
          tar -xzf secure_runtime/source.tar.gz -C secure_runtime/source
          test -s secure_runtime/source/payload/lib/main.dart
          test -s secure_runtime/source/payload/test/alpha20_runtime_test.dart
          rm -f secure_runtime/aes.key secure_runtime/key.enc secure_runtime/source.enc

      - name: Create alpha20 Android project
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_app dist
          flutter create --platforms=android \
            --org com.fx564286 \
            --project-name cinema_seat_alert build_app
          mkdir -p dist
          rm -rf build_app/lib build_app/test
          cp -R secure_runtime/source/payload/lib build_app/lib
          cp -R secure_runtime/source/payload/test build_app/test
          cat > build_app/pubspec.yaml <<'PUBSPEC'
          name: cinema_seat_alert
          description: Cineseat alpha20 secure validation build
          publish_to: none
          version: 0.2.1-alpha.20+40

          environment:
            sdk: ">=3.10.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            geolocator: ^14.0.3
            http: ^1.4.0
            shared_preferences: ^2.5.5
            url_launcher: ^6.3.2
            webview_flutter: ^4.14.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0

          flutter:
            uses-material-design: true
          PUBSPEC
          python3 secure_runtime/source/payload/prepare_android.py build_app

      - name: Analyze and run alpha20 user-flow tests
        if: steps.payload.outputs.present == 'true'
        working-directory: build_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/wizard_runtime_test.dart test/alpha20_runtime_test.dart --reporter expanded

      - name: Build alpha20 validation APK
        if: steps.payload.outputs.present == 'true'
        working-directory: build_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name=0.2.1-alpha.20 \
            --build-number=40
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../dist/cineseat-0.2.1-alpha.20-VALIDATION.apk

      - name: Verify and package validation APK
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/cineseat-0.2.1-alpha.20-VALIDATION.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          unzip -t "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" \
            | tee dist/APK-SIGNATURE.txt
          "$TOOLS/aapt" dump badging "$APK" \
            | tee dist/APK-PACKAGE-INFO.txt
          grep -q "package: name='com.fx564286.cinema_seat_alert'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionCode='40'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.20'" dist/APK-PACKAGE-INFO.txt
          cp "$TOOLS/lib/apksigner.jar" dist/apksigner.jar
          cp "$TOOLS/zipalign" dist/zipalign
          chmod +x dist/zipalign
          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          cat > dist/SECURE-BUILD.txt <<'NOTES'
          Plain source was decrypted only inside the ephemeral Actions runner.
          The public branch contains only AES-encrypted payload bytes.
          The one-time RSA private key cache is destroyed after successful upload.
          NOTES

      - name: Upload alpha20 validation package
        if: steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha20-secure-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Destroy decrypted files and one-time key cache
        if: always() && steps.payload.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf secure_runtime/source build_app
          rm -f secure_runtime/private.pem secure_runtime/public.pem secure_runtime/source.tar.gz
          gh cache delete cineseat-secure-builder-key-v1 --confirm || true
