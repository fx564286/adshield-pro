name: Cineseat Alpha25 Alpha19 Region

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA25_BUILD_TRIGGER.txt'
      - 'secure_payload/apply_alpha25_alpha19_region_condition.py.gz.b64.part*'
      - '.github/workflows/cineseat-alpha25-alpha19-region.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha25-alpha19-region-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct stable and alpha25 patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part00 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part01 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part02 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03a \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03b \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part04 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part05 \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha22_seat_ui_fix.py
          cat secure_payload/apply_alpha23_ui_cache.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha23_ui_cache.py
          cat secure_payload/apply_alpha25_alpha19_region_condition.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha25_alpha19_region_condition.py
          echo '28901ab270d253693ef69d93ed11a92d87d98f6057528eb0342da914c655ec3b  secure_payload/apply_alpha25_alpha19_region_condition.py' | sha256sum -c -
          python3 -m py_compile secure_payload/apply_alpha22_seat_ui_fix.py
          python3 -m py_compile secure_payload/apply_alpha22_booking_helper_fix.py
          python3 -m py_compile secure_payload/apply_alpha23_ui_cache.py
          python3 -m py_compile secure_payload/apply_alpha25_alpha19_region_condition.py

      - name: Prepare alpha25 stable builder wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('secure_payload/build_alpha21_overlay_v2_public.sh')
          wrapper = source.read_text(encoding='utf-8')
          addon_anchor = 'rm -f "$SOURCE/payload/test/alpha20_runtime_test.dart"\n'
          if addon_anchor not in wrapper:
              raise SystemExit('stable home addon anchor missing')
          wrapper = wrapper.replace(
              addon_anchor,
              addon_anchor +
              'python3 secure_payload/apply_alpha22_seat_ui_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha22_booking_helper_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha23_ui_cache.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha25_alpha19_region_condition.py "$SOURCE/payload"\n' +
              'printf "\\n// Cineseat 0.2.1-alpha.25\\n" >> "$SOURCE/payload/lib/wizard_v4.dart"\n',
              1,
          )

          text_anchor = "text = source.read_text(encoding='utf-8')\n"
          if text_anchor not in wrapper:
              raise SystemExit('underlying builder text anchor missing')
          wrapper = wrapper.replace(
              text_anchor,
              text_anchor +
              "text = text.replace('0.2.1-alpha.21', '0.2.1-alpha.25')\n" +
              "text = text.replace('version: 0.2.1-alpha.25+41', 'version: 0.2.1-alpha.25+45')\n" +
              "text = text.replace('--build-number=41', '--build-number=45')\n" +
              "text = text.replace(\"versionCode='41'\", \"versionCode='45'\")\n" +
              "text = text.replace('Cineseat 0.2.1-alpha.21 validation build', 'Cineseat 0.2.1-alpha.25 validation build')\n" +
              "text = text.replace(\"if '0.2.1-alpha.21' not in all_dart:\", \"if '0.2.1-alpha.25' not in all_dart:\")\n" +
              "text = text.replace('alpha21 version marker is missing', 'alpha25 version marker is missing')\n",
              1,
          )
          wrapper = wrapper.replace(
              '/tmp/build_alpha21_overlay_v2_public.sh',
              '/tmp/build_alpha25_overlay_v2_public.sh',
          )
          Path('/tmp/run_alpha25_stable.sh').write_text(wrapper, encoding='utf-8')
          PY
          chmod +x /tmp/run_alpha25_stable.sh

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build and verify Cineseat alpha25
        shell: bash
        run: bash /tmp/run_alpha25_stable.sh

      - name: Verify alpha25 source and package
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode='45'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.25'" dist/APK-PACKAGE-INFO.txt
          test -s dist/cineseat-0.2.1-alpha.25-VALIDATION.apk
          unzip -tq dist/cineseat-0.2.1-alpha.25-VALIDATION.apk
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - alpha19-style single-card region selector restored instead of the alpha24 two-pane browser
          - first-level province and second-level district selection remain in one expandable card
          - selected region is shown as province > district and theater cards remain below the selector
          - all four watch-condition selector cards have identical fixed dimensions
          - old and new condition editors no longer overlap because the stacking switcher was removed
          - remaining-seat, adjacent-seat, preferred-zone and specific-seat settings have distinct controls
          - preferred-zone count and adjacent-seat count are clearly separated
          - specific-seat all/any cancellation rules use two independent rounded cards
          - alpha23 theater/catalog cache and alpha22 seat map, zoom, magnifier and booking handoff retained
          REPORT

      - name: Upload alpha25 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha25-alpha19-region-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
