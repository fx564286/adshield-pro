name: video-toolchain-vace-human-v2v
on:
  push:
    branches: [video-toolchain-probe]
  workflow_dispatch:

jobs:
  vace-human-v2v:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ARCH-PROBE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Runtime resources
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          nproc
          free -h
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download stable-diffusion.cpp CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-820-de298c2/sd-master-de298c2-bin-Linux-Ubuntu-24.04-x86_64.zip'
          curl -L --fail --retry 3 "$URL" -o sd-cpp.zip
          echo '7ecc39e2485ec871d127d004d2bac4c2640eea7d0235cb6b131a8006322e0ce3  sd-cpp.zip' | sha256sum -c -
          unzip -q sd-cpp.zip -d sd-cpp
          CLI=$(find sd-cpp -type f -name 'sd-cli*' | head -n1)
          chmod +x "$CLI"
          "$CLI" -h | grep -E 'vid_gen|video-frames|control-video|offload-to-cpu|rpc-servers|mmap'

      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: vace-1.3b-fp16-umt5-q3ks-vae-v1

      - name: Download and verify compatible VACE model set
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p models
          curl -L --fail --retry 4 'https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/diffusion_models/wan2.1_vace_1.3B_fp16.safetensors?download=true' -o models/vace-fp16.safetensors
          curl -L --fail --retry 4 'https://huggingface.co/city96/umt5-xxl-encoder-gguf/resolve/main/umt5-xxl-encoder-Q3_K_S.gguf?download=true' -o models/umt5-q3ks.gguf
          curl -L --fail --retry 4 'https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors?download=true' -o models/wan-vae.safetensors
          echo '640ccc0577e6a5d4bb15cd91b11b699ef914fc55f126c5a1c544e152130784f2  models/vace-fp16.safetensors' | sha256sum -c -
          echo 'f64f8d6dc4d8a24276df69d0ccea789aae686f7417950a41e6568c30cb478a5c  models/umt5-q3ks.gguf' | sha256sum -c -
          echo '2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b  models/wan-vae.safetensors' | sha256sum -c -

      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models
          key: vace-1.3b-fp16-umt5-q3ks-vae-v1

      - name: Verify model integrity
        shell: bash
        run: |
          set -euxo pipefail
          echo '640ccc0577e6a5d4bb15cd91b11b699ef914fc55f126c5a1c544e152130784f2  models/vace-fp16.safetensors' | sha256sum -c -
          echo 'f64f8d6dc4d8a24276df69d0ccea789aae686f7417950a41e6568c30cb478a5c  models/umt5-q3ks.gguf' | sha256sum -c -
          echo '2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b  models/wan-vae.safetensors' | sha256sum -c -
          ls -lh models
          free -h

      - name: Prepare public full-body dance source and motion control
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/leejet/stable-diffusion.cpp/de298c225bed97c3f9026b73cd7b71e7879bd41b/assets/wan/Wan2.1_1.3B_vace_v2v.mp4' -o official-dance.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json official-dance.mp4 | tee official-source-probe.json
          mkdir -p control
          ffmpeg -y -v error -i official-dance.mp4 -vf "select='not(mod(n,4))',scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black" -vsync 0 -frames:v 9 control/frame_%04d.png
          ffmpeg -y -v error -i official-dance.mp4 -vf 'select=eq(n\,0),scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black' -frames:v 1 source.png
          test "$(find control -name 'frame_*.png' | wc -l)" -eq 9
          file source.png
          sha256sum control/frame_*.png | tee control-frame-sha256.txt
          test "$(sha256sum control/frame_*.png | awk '{print $1}' | sort -u | wc -l)" -eq 9

      - name: Actual human VACE V2V generative inference
        shell: bash
        run: |
          set -euxo pipefail
          CLI=$(find sd-cpp -type f -name 'sd-cli*' | head -n1)
          /usr/bin/time -v "$CLI" \
            -M vid_gen \
            --diffusion-model models/vace-fp16.safetensors \
            --vae models/wan-vae.safetensors \
            --t5xxl models/umt5-q3ks.gguf \
            -i source.png \
            --control-video control \
            -p 'a young adult woman performing a natural energetic idol dance in a studio, coherent full body, realistic face, natural arms and legs, consistent clothing, cinematic movement' \
            -n 'static, deformed, duplicate limbs, extra arms, extra legs, extra fingers, broken hands, distorted face, ghosting, blurry, melting body' \
            --cfg-scale 6.0 \
            --sampling-method euler \
            --steps 8 \
            --flow-shift 3.0 \
            --video-frames 9 \
            --fps 4 \
            --offload-to-cpu \
            --mmap \
            --vae-tiling \
            --diffusion-fa \
            -t 4 \
            -W 288 -H 512 \
            -o human-v2v.avi \
            -v 2>&1 | tee human-v2v.log
          test -s human-v2v.avi
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames -show_entries format=duration,size -of json human-v2v.avi | tee human-v2v-ffprobe.json
          ffmpeg -y -v error -i human-v2v.avi -vf 'scale=216:384,tile=9x1' -frames:v 1 human-v2v-contact.png
          printf 'REAL_VACE_HUMAN_V2V=PASS\nEXTERNAL_MCP_INFERENCE=NO\n' > human-v2v-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vace-human-v2v
          path: |
            human-v2v.avi
            human-v2v.log
            human-v2v-ffprobe.json
            human-v2v-contact.png
            human-v2v-report.txt
            source.png
            official-source-probe.json
            control-frame-sha256.txt
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  architecture-probe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ARCH-PROBE]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe stable-diffusion.cpp distributed/RPC runtime
        shell: bash
        run: |
          set -euxo pipefail
          nproc | tee cpus.txt
          free -h | tee memory.txt
          URL='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-820-de298c2/sd-master-de298c2-bin-Linux-Ubuntu-24.04-x86_64.zip'
          curl -L --fail --retry 3 "$URL" -o sd.zip
          echo '7ecc39e2485ec871d127d004d2bac4c2640eea7d0235cb6b131a8006322e0ce3  sd.zip' | sha256sum -c -
          unzip -q sd.zip -d sd
          find sd -maxdepth 3 -type f -printf '%P\n' | sort | tee runtime-files.txt
          CLI=$(find sd -type f -name 'sd-cli*' | head -n1)
          chmod +x "$CLI"
          "$CLI" -h > sd-cli-help.txt 2>&1
          grep -n -E 'rpc|server|split|backend|offload|mmap|stream|cache|vid_gen|control-video' sd-cli-help.txt | tee distributed-capabilities.txt
          RPC=$(find sd -type f \( -iname '*rpc*server*' -o -iname 'rpc-server*' \) | head -n1 || true)
          if [ -n "$RPC" ]; then
            chmod +x "$RPC"
            "$RPC" --help > rpc-server-help.txt 2>&1 || true
            printf 'RPC_SERVER_BINARY=PASS\nRPC_SERVER_PATH=%s\n' "$RPC" | tee rpc-report.txt
          else
            printf 'RPC_SERVER_BINARY=ABSENT_IN_PREBUILT_RELEASE\n' | tee rpc-report.txt
          fi
          printf 'CHATGPT_PER_FRAME_INFERENCE=NO\nEXTERNAL_MCP_INFERENCE=NO\n' >> rpc-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: distributed-capability-probe
          path: |
            cpus.txt
            memory.txt
            runtime-files.txt
            sd-cli-help.txt
            distributed-capabilities.txt
            rpc-server-help.txt
            rpc-report.txt
          if-no-files-found: ignore
          retention-days: 3

  parallel-worker-probe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ARCH-PROBE]') }}
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify independent token-free render worker
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          {
            echo "WORKER=${{ matrix.worker }}"
            echo "CPUS=$(nproc)"
            free -b | awk '/Mem:/ {print "MEM_BYTES="$2}'
            echo "SEED=$((42000 + ${{ matrix.worker }}))"
            echo 'ROLE=parallel_candidate_render'
            echo 'CHATGPT_PER_FRAME_INFERENCE=NO'
            echo 'EXTERNAL_MCP_INFERENCE=NO'
          } | tee out/worker-${{ matrix.worker }}.txt
          sha256sum out/worker-${{ matrix.worker }}.txt > out/worker-${{ matrix.worker }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: distributed-worker-${{ matrix.worker }}
          path: out/
          retention-days: 3
