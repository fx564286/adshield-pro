name: Export Alpha24 Patch

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/EXPORT_ALPHA24_PATCH_TRIGGER.txt'
      - '.github/workflows/export-alpha24-patch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct alpha24 patch
        shell: bash
        run: |
          set -euo pipefail
          cat secure_payload/apply_alpha24_region_condition.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > apply_alpha24_region_condition.py
          python3 -m py_compile apply_alpha24_region_condition.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha24-patch-source
          path: apply_alpha24_region_condition.py
          retention-days: 2
