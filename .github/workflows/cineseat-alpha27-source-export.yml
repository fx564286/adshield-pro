name: Temporary Encrypted Cineseat Alpha27 Source Export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cineseat-alpha27-source-export.yml'
      - 'alpha27_extract_cert.pem'
      - 'cineseat_source_chunks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout encrypted carrier
        uses: actions/checkout@v4

      - name: Restore PR-scoped decryption key
        uses: actions/cache@v4
        with:
          path: .cineseat-key
          key: cineseat-alpha26-pr6-rsa-v1
          fail-on-cache-miss: true

      - name: Decrypt and re-encrypt source for local repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(find cineseat_source_chunks -maxdepth 1 -type f -name 'chunk_*' | wc -l)" -eq 7
          test -s .cineseat-key/private.pem
          test -s .cineseat-key/cert.pem
          test -s alpha27_extract_cert.pem
          cat cineseat_source_chunks/chunk_* > "$RUNNER_TEMP/source.b64"
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/source.cms" \
            -recip .cineseat-key/cert.pem \
            -inkey .cineseat-key/private.pem \
            -out "$RUNNER_TEMP/source.tar.gz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          tar -czf "$RUNNER_TEMP/source-export.tar.gz" -C "$RUNNER_TEMP/source" .
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/source-export.tar.gz" \
            -out "$RUNNER_TEMP/cineseat-alpha27-source-export.cms" \
            alpha27_extract_cert.pem
          sha256sum "$RUNNER_TEMP/cineseat-alpha27-source-export.cms" \
            > "$RUNNER_TEMP/cineseat-alpha27-source-export.sha256"

      - name: Upload encrypted source export
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha27-encrypted-source-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/cineseat-alpha27-source-export.cms
            ${{ runner.temp }}/cineseat-alpha27-source-export.sha256
          if-no-files-found: error
          retention-days: 1
