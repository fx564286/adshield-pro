name: video-wan22-i2v-stability
on:
  push:
    branches: [video-toolchain-probe]
    paths:
      - '.github/workflows/video-wan22-i2v-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_CACHE_KEY: vace-1.3b-fp16-umt5-q3ks-vae-v1
  WAN22_CACHE_KEY: wan22-ti2v-5b-q4km-umt5-q3ks-vae-v1

jobs:
  anchored-human-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Runtime install
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-820-de298c2/sd-master-de298c2-bin-Linux-Ubuntu-24.04-x86_64.zip'
          curl -L --fail --retry 4 "$URL" -o sd.zip
          echo '7ecc39e2485ec871d127d004d2bac4c2640eea7d0235cb6b131a8006322e0ce3  sd.zip' | sha256sum -c -
          unzip -q sd.zip -d sd
          chmod +x sd/sd-cli

      - uses: actions/cache/restore@v4
        id: base-cache
        with:
          path: models
          key: ${{ env.BASE_CACHE_KEY }}

      - uses: actions/cache/restore@v4
        id: wan22-cache
        with:
          path: wan22_models
          key: ${{ env.WAN22_CACHE_KEY }}

      - name: Verify caches
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.base-cache.outputs.cache-hit }}" = true
          test "${{ steps.wan22-cache.outputs.cache-hit }}" = true
          MODEL_REL="$(cat wan22_models/model-file.txt)"
          test -s "wan22_models/$MODEL_REL"
          test -s wan22_models/split_files/vae/wan2.2_vae.safetensors
          test -s models/umt5-q3ks.gguf

      - name: Prepare clean full-body anchor
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20woman%20on%20dancing%20floor.webm' -o source.webm
          ffmpeg -y -v error -ss 5 -i source.webm -frames:v 1 -vf 'scale=384:672:force_original_aspect_ratio=decrease,pad=384:672:(ow-iw)/2:(oh-ih)/2:black' anchor.png
          test -s anchor.png

      - name: Actual anchored Wan2.2 I2V stability gate
        shell: bash
        run: |
          set -euxo pipefail
          MODEL_REL="$(cat wan22_models/model-file.txt)"
          /usr/bin/time -v sd/sd-cli \
            -M vid_gen \
            --diffusion-model "wan22_models/$MODEL_REL" \
            --vae wan22_models/split_files/vae/wan2.2_vae.safetensors \
            --t5xxl models/umt5-q3ks.gguf \
            -i anchor.png \
            -p 'same adult woman, same face, same clothing, full body visible, making one small natural dance step, anatomically correct human body, realistic proportions, clean studio-like scene, realistic photographic detail' \
            -n 'different person, face change, duplicate person, crowd, extra arms, extra legs, fused limbs, missing limbs, malformed hands, distorted torso, melted body, ghosting, blur, surreal background, abstract shapes' \
            --cfg-scale 4.0 --sampling-method euler --steps 10 --flow-shift 3.0 \
            --video-frames 5 --fps 4 --seed 44100 \
            --diffusion-fa --offload-to-cpu --mmap --vae-tiling -t 4 \
            -W 384 -H 672 -o wan22-i2v-stability.avi -v 2>&1 | tee wan22-i2v-stability.log
          test -s wan22-i2v-stability.avi

      - name: Preview and QA assets
        shell: bash
        run: |
          set -euxo pipefail
          ffmpeg -y -v error -i wan22-i2v-stability.avi -c:v libx264 -pix_fmt yuv420p -movflags +faststart wan22-i2v-stability.mp4
          ffmpeg -y -v error -i wan22-i2v-stability.avi -vf 'scale=192:336,tile=5x1' -frames:v 1 wan22-i2v-contact.png
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json wan22-i2v-stability.mp4 > ffprobe.json
          printf 'GATE=ANCHORED_I2V\nSEED=44100\nFRAMES=5\nTARGET=HUMAN_RECOGNIZABILITY_FIRST\n' > report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wan22-i2v-stability-seed-44100
          path: |
            anchor.png
            wan22-i2v-stability.avi
            wan22-i2v-stability.mp4
            wan22-i2v-stability.log
            wan22-i2v-contact.png
            ffprobe.json
            report.txt
          if-no-files-found: ignore
          retention-days: 5
          compression-level: 0
