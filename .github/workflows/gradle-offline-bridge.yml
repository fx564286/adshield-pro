name: Gradle Offline Bridge

on:
  push:
    branches:
      - chatgpt/gradle-offline-bridge-20260812
    paths:
      - '.github/workflows/gradle-offline-bridge.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Gradle 9.1.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o gradle-9.1.0-all.zip https://services.gradle.org/distributions/gradle-9.1.0-all.zip
          curl -fL --retry 3 -o gradle-9.1.0-all.zip.sha256 https://services.gradle.org/distributions/gradle-9.1.0-all.zip.sha256
          printf '%s  %s\n' "$(tr -d '[:space:]' < gradle-9.1.0-all.zip.sha256)" gradle-9.1.0-all.zip | sha256sum -c -
          gzip -1 -c gradle-9.1.0-all.zip > gradle-9.1.0-all.zip.gz
          sha256sum gradle-9.1.0-all.zip gradle-9.1.0-all.zip.gz | tee gradle-checksums.txt
          cat gradle-9.1.0-all.zip.sha256
          ls -lh gradle-9.1.0-all.zip gradle-9.1.0-all.zip.gz gradle-checksums.txt

      - name: Upload gzip-wrapped Gradle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-9.1.0-all-gzip
          path: |
            ${{ runner.temp }}/gradle-9.1.0-all.zip.gz
            ${{ runner.temp }}/gradle-9.1.0-all.zip.sha256
            ${{ runner.temp }}/gradle-checksums.txt
          compression-level: 0
          retention-days: 1
