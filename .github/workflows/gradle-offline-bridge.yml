name: Gradle Offline Bridge

on:
  push:
    branches:
      - chatgpt/gradle-offline-bridge-20260812
    paths:
      - '.github/workflows/gradle-offline-bridge.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Gradle 8.14
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o gradle-8.14-bin.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          echo '61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa  gradle-8.14-bin.zip' | sha256sum -c -
          gzip -1 -c gradle-8.14-bin.zip > gradle-8.14-bin.zip.gz
          sha256sum gradle-8.14-bin.zip gradle-8.14-bin.zip.gz | tee gradle-checksums.txt
          ls -lh gradle-8.14-bin.zip gradle-8.14-bin.zip.gz gradle-checksums.txt

      - name: Upload gzip-wrapped Gradle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.14-bin-gzip
          path: |
            ${{ runner.temp }}/gradle-8.14-bin.zip.gz
            ${{ runner.temp }}/gradle-checksums.txt
          compression-level: 0
          retention-days: 1
