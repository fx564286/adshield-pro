name: Cineseat Alpha21 Stable Watch

on:
  pull_request:
    branches: [cineseat-secure-builder]

permissions:
  contents: read
  actions: write

jobs:
  build:
    if: github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Validate encrypted inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s secure_payload/source.enc.b64.part01
          test -s secure_payload/source.enc.b64.part10
          test -s secure_payload/key.enc.b64
          test -s secure_payload/native.enc.b64
          test -s secure_payload/native.key.enc.b64
          test -s secure_payload/alpha21-delta.enc.b64
          test -s secure_payload/alpha21-delta.key.enc.b64

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Decrypt stable alpha19 source
        shell: bash
        run: |
          set -euo pipefail
          test -s secure_runtime/private.pem
          mkdir -p secure_runtime/source
          base64 --decode secure_payload/key.enc.b64 > secure_runtime/source.key.enc
          openssl pkeyutl -decrypt \
            -inkey secure_runtime/private.pem \
            -in secure_runtime/source.key.enc \
            -out secure_runtime/source.aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          cat secure_payload/source.enc.b64.part* \
            | base64 --decode > secure_runtime/source.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secure_runtime/source.enc \
            -out secure_runtime/source.tar.gz \
            -pass file:secure_runtime/source.aes.key
          tar -xzf secure_runtime/source.tar.gz -C secure_runtime/source
          test -s secure_runtime/source/payload/lib/wizard_v4.dart
          test -s secure_runtime/source/payload/test/wizard_runtime_test.dart

      - name: Apply encrypted alpha21 delta and icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secure_runtime/delta
          base64 --decode secure_payload/alpha21-delta.key.enc.b64 \
            > secure_runtime/delta.key.enc
          openssl pkeyutl -decrypt \
            -inkey secure_runtime/private.pem \
            -in secure_runtime/delta.key.enc \
            -out secure_runtime/delta.aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          base64 --decode secure_payload/alpha21-delta.enc.b64 \
            > secure_runtime/delta.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secure_runtime/delta.enc \
            -out secure_runtime/delta.tar.xz \
            -pass file:secure_runtime/delta.aes.key
          tar -xJf secure_runtime/delta.tar.xz -C secure_runtime/delta
          cd secure_runtime/source/payload
          patch -p1 < ../../delta/delta/alpha21.diff
          cp ../../delta/delta/app_icon.png app_icon.png

      - name: Verify rolled-back watch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('secure_runtime/source/payload')
          texts = {
              'wizard': (root / 'lib/wizard_v4.dart').read_text(encoding='utf-8'),
              'controller': (root / 'lib/app_controller.dart').read_text(encoding='utf-8'),
              'home': (root / 'lib/home.dart').read_text(encoding='utf-8'),
          }
          required = {
              'wizard': [
                  'class WatchWizard',
                  'this.initialItem',
                  "String _districtFilter = '전체';",
                  "Key('region_filter_panel')",
                  "Key('district_filter_wrap')",
                  "'서울'",
                  "'강남구'",
              ],
              'controller': [
                  'BackgroundMonitor.syncWatches(items)',
                  'Future<void> add(WatchItem item)',
                  'Future<void> toggle(WatchItem item)',
              ],
              'home': ['WatchWizard('],
          }
          missing = {
              name: [token for token in tokens if token not in texts[name]]
              for name, tokens in required.items()
              if any(token not in texts[name] for token in tokens)
          }
          if missing:
              raise SystemExit(f'alpha21 source verification failed: {missing}')
          all_dart = '\n'.join(
              p.read_text(encoding='utf-8') for p in (root / 'lib').rglob('*.dart')
          )
          if "'기타'" in all_dart or 'return \'기타\'' in all_dart:
              raise SystemExit('user-visible 기타 region remains')
          if 'class NewWatchWizard' in all_dart or 'class EditWatchWizard' in all_dart:
              raise SystemExit('broken alpha20 split watch flow remains')
          print('alpha21 stable watch, district region and icon source verified')
          PY

      - name: Decrypt Android background module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secure_runtime/native
          base64 --decode secure_payload/native.key.enc.b64 \
            > secure_runtime/native.key.enc
          openssl pkeyutl -decrypt \
            -inkey secure_runtime/private.pem \
            -in secure_runtime/native.key.enc \
            -out secure_runtime/native.aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          base64 --decode secure_payload/native.enc.b64 \
            > secure_runtime/native.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secure_runtime/native.enc \
            -out secure_runtime/native.tar.gz \
            -pass file:secure_runtime/native.aes.key
          tar -xzf secure_runtime/native.tar.gz -C secure_runtime/native
          test -s secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/MainActivity.kt
          test -s secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/SeatMonitorService.kt
          test -s secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/BootReceiver.kt

      - name: Create deterministic Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_app dist
          flutter create --platforms=android \
            --org com.fx564286 \
            --project-name cinema_seat_alert build_app
          mkdir -p dist
          rm -rf build_app/lib build_app/test
          cp -R secure_runtime/source/payload/lib build_app/lib
          cp -R secure_runtime/source/payload/test build_app/test
          printf "export 'wizard_v4.dart';\n" > build_app/lib/wizard.dart
          cat > build_app/pubspec.yaml <<'PUBSPEC'
          name: cinema_seat_alert
          description: Cineseat alpha21 stable seat watch and district regions
          publish_to: none
          version: 0.2.1-alpha.21+41

          environment:
            sdk: ">=3.10.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            geolocator: ^14.0.3
            http: ^1.4.0
            shared_preferences: ^2.5.5
            url_launcher: ^6.3.2
            webview_flutter: ^4.14.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0

          flutter:
            uses-material-design: true
          PUBSPEC

          KOTLIN_DIR=build_app/android/app/src/main/kotlin/com/fx564286/cinema_seat_alert
          mkdir -p "$KOTLIN_DIR"
          cp secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/MainActivity.kt "$KOTLIN_DIR/"
          cp secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/SeatMonitorService.kt "$KOTLIN_DIR/"
          cp secure_runtime/native/kotlin/com/fx564286/cinema_seat_alert/BootReceiver.kt "$KOTLIN_DIR/"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
            build_app/android/app/build.gradle.kts
          python3 secure_payload/patch_cineseat_android.py build_app
          for dir in build_app/android/app/src/main/res/mipmap-*; do
            cp secure_runtime/source/payload/app_icon.png "$dir/ic_launcher.png"
          done
          cat >> build_app/android/gradle.properties <<'GRADLE'
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
          kotlin.incremental=true
          android.useAndroidX=true
          GRADLE

      - name: Analyze and test alpha21 user flows
        working-directory: build_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/wizard_runtime_test.dart --reporter expanded

      - name: Build alpha21 release APK
        working-directory: build_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name=0.2.1-alpha.21 \
            --build-number=41
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../dist/cineseat-0.2.1-alpha.21-VALIDATION.apk

      - name: Verify APK package, permissions and components
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/cineseat-0.2.1-alpha.21-VALIDATION.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK"
          unzip -t "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" \
            | tee dist/APK-SIGNATURE.txt
          "$TOOLS/aapt" dump badging "$APK" \
            | tee dist/APK-PACKAGE-INFO.txt
          "$TOOLS/aapt" dump permissions "$APK" \
            | tee dist/APK-PERMISSIONS.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml \
            | tee dist/APK-MANIFEST.txt
          grep -q "package: name='com.fx564286.cinema_seat_alert'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionCode='41'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.21'" dist/APK-PACKAGE-INFO.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' dist/APK-PERMISSIONS.txt
          grep -q 'android.permission.WAKE_LOCK' dist/APK-PERMISSIONS.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' dist/APK-PERMISSIONS.txt
          grep -q 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' dist/APK-PERMISSIONS.txt
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' dist/APK-PERMISSIONS.txt
          grep -q 'SeatMonitorService' dist/APK-MANIFEST.txt
          grep -q 'BootReceiver' dist/APK-MANIFEST.txt
          cp "$TOOLS/lib/apksigner.jar" dist/apksigner.jar
          cp "$TOOLS/zipalign" dist/zipalign
          chmod +x dist/zipalign
          sha256sum "$APK" | tee dist/SHA256SUMS.txt
          cat > dist/BUILD_REPORT.txt <<'REPORT'
          Cineseat 0.2.1-alpha.21 validation build
          - stable alpha.19 WatchWizard create/edit/save flow restored
          - broken alpha.20 split watch flow absent
          - province and city/county/district region selector
          - no user-visible 기타 region
          - dedicated cinema seat launcher icon
          - foreground seat monitor and boot recovery included
          REPORT

      - name: Upload alpha21 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha21-stable-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove decrypted source and keys
        if: always()
        shell: bash
        run: |
          rm -rf secure_runtime/source secure_runtime/delta secure_runtime/native build_app
          rm -f secure_runtime/*.aes.key secure_runtime/*.key.enc \
            secure_runtime/*.enc secure_runtime/*.tar.gz secure_runtime/*.tar.xz
