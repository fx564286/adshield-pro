name: video-vace-longdance-b
on:
  workflow_dispatch:
    inputs:
      a_run_id:
        description: 'Clip A workflow run ID'
        required: true
        type: string
      a_artifact_name:
        description: 'Selected Clip A artifact name'
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  MODEL_CACHE_KEY: vace-1.3b-fp16-umt5-q3ks-vae-v1

jobs:
  render-b:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - worker: 0
            seed: 42200
          - worker: 1
            seed: 42201
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python3 -m pip install --quiet --break-system-packages 'mediapipe==0.10.21' opencv-python-headless numpy
          URL='https://github.com/leejet/stable-diffusion.cpp/releases/download/master-820-de298c2/sd-master-de298c2-bin-Linux-Ubuntu-24.04-x86_64.zip'
          curl -L --fail --retry 3 "$URL" -o sd.zip
          echo '7ecc39e2485ec871d127d004d2bac4c2640eea7d0235cb6b131a8006322e0ce3  sd.zip' | sha256sum -c -
          unzip -q sd.zip -d sd
          chmod +x sd/sd-cli

      - name: Restore VACE model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Verify models
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.model-cache.outputs.cache-hit }}" = true
          echo '640ccc0577e6a5d4bb15cd91b11b699ef914fc55f126c5a1c544e152130784f2  models/vace-fp16.safetensors' | sha256sum -c -
          echo 'f64f8d6dc4d8a24276df69d0ccea789aae686f7417950a41e6568c30cb478a5c  models/umt5-q3ks.gguf' | sha256sum -c -
          echo '2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b  models/wan-vae.safetensors' | sha256sum -c -

      - name: Download selected Clip A and extract identity anchor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          RUN='${{ inputs.a_run_id }}'
          NAME='${{ inputs.a_artifact_name }}'
          META=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts?per_page=100")
          ID=$(printf '%s' "$META" | jq -r --arg n "$NAME" '.artifacts[] | select(.name==$n) | .id' | head -n1)
          test -n "$ID" && test "$ID" != null
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip" -o a.zip
          mkdir a && unzip -q a.zip -d a
          AVI=$(find a -name 'longdance-a-*.avi' | head -n1)
          test -s "$AVI"
          ffmpeg -y -v error -sseof -0.25 -i "$AVI" -frames:v 1 source.png
          test -s source.png
          echo "A_ARTIFACT=$NAME" > continuity-report.txt
          echo 'ANCHOR=LAST_GENERATED_FRAME' >> continuity-report.txt

      - name: Build real 5-10s single-person pose control
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 'https://commons.wikimedia.org/wiki/Special:Redirect/file/A%20woman%20on%20dancing%20floor.webm' -o source.webm
          mkdir -p rgb41 controlB
          ffmpeg -y -v error -ss 5 -i source.webm -vf 'fps=4,scale=288:512:force_original_aspect_ratio=decrease,pad=288:512:(ow-iw)/2:(oh-ih)/2:black' -frames:v 41 rgb41/frame_%04d.png
          cat > pose.py <<'PY'
          import cv2, glob, numpy as np, mediapipe as mp
          Pose=mp.solutions.pose.Pose; C=list(mp.solutions.pose.POSE_CONNECTIONS); fs=sorted(glob.glob('rgb41/frame_*.png')); seq=[]
          with Pose(static_image_mode=True,model_complexity=2,enable_segmentation=False,min_detection_confidence=.45) as p:
            for path in fs:
              im=cv2.imread(path); h,w=im.shape[:2]; x0=int(w*.12); x1=int(w*.88); r=p.process(cv2.cvtColor(im[:,x0:x1],cv2.COLOR_BGR2RGB)); arr=None
              if r.pose_landmarks:
                pts=np.array([[x0+lm.x*(x1-x0),lm.y*h,lm.visibility] for lm in r.pose_landmarks.landmark],np.float32)
                if float(np.mean(pts[[11,12,23,24,25,26],2]))>=.35: arr=pts
              seq.append(arr)
          good=[i for i,x in enumerate(seq) if x is not None]
          for i,x in enumerate(seq):
            if x is not None: continue
            lo=max([g for g in good if g<i],default=None); hi=min([g for g in good if g>i],default=None)
            if lo is not None and hi is not None:
              a=(i-lo)/(hi-lo); seq[i]=(1-a)*seq[lo]+a*seq[hi]
            elif lo is not None: seq[i]=seq[lo].copy()
            elif hi is not None: seq[i]=seq[hi].copy()
            else: raise SystemExit('no pose anchors')
          for j,pts in enumerate(seq[20:41],1):
            c=np.zeros((512,288,3),np.uint8)
            for a,b in C:
              xa,ya,va=pts[a]; xb,yb,vb=pts[b]
              if min(va,vb)>=.12: cv2.line(c,(int(xa),int(ya)),(int(xb),int(yb)),(255,255,255),3,cv2.LINE_AA)
            for x,y,v in pts:
              if v>=.12: cv2.circle(c,(int(x),int(y)),4,(255,255,255),-1,cv2.LINE_AA)
            cv2.imwrite(f'controlB/frame_{j:04d}.png',c)
          PY
          python3 pose.py
          test "$(find controlB -name 'frame_*.png' | wc -l)" -eq 21

      - name: Actual 5-10s continuity VACE inference
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v sd/sd-cli \
            -M vid_gen \
            --diffusion-model models/vace-fp16.safetensors \
            --vae models/wan-vae.safetensors \
            --t5xxl models/umt5-q3ks.gguf \
            -i source.png --control-video controlB \
            -p 'the same young adult woman continuing the same natural energetic full body dance in the same clean modern studio, photorealistic, stable realistic face, anatomically correct arms legs and hands, identical clothing and identity, strong articulated movement, full body visible' \
            -n 'identity change, clothing change, static, crowd, background people, deformed, duplicate limbs, extra arms, extra legs, extra fingers, broken hands, distorted face, ghosting, blurry, melting body, fused limbs' \
            --cfg-scale 6.0 --sampling-method euler --steps 6 --flow-shift 3.0 \
            --video-frames 21 --fps 4 --seed ${{ matrix.seed }} \
            --offload-to-cpu --mmap --vae-tiling --diffusion-fa -t 4 -W 288 -H 512 \
            -o longdance-b-${{ matrix.worker }}.avi -v 2>&1 | tee longdance-b-${{ matrix.worker }}.log
          test -s longdance-b-${{ matrix.worker }}.avi
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json longdance-b-${{ matrix.worker }}.avi > ffprobe-${{ matrix.worker }}.json
          ffmpeg -y -v error -i longdance-b-${{ matrix.worker }}.avi -vf 'scale=144:256,tile=7x3' -frames:v 1 result-contact-${{ matrix.worker }}.png
          printf 'REAL_GENERATIVE_LONGDANCE_B=PASS\nSEED=${{ matrix.seed }}\nCONTROL_FRAMES=21\nANCHOR=LAST_GENERATED_A_FRAME\n' >> continuity-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longdance-b-${{ matrix.worker }}-seed-${{ matrix.seed }}
          path: |
            longdance-b-${{ matrix.worker }}.avi
            longdance-b-${{ matrix.worker }}.log
            ffprobe-${{ matrix.worker }}.json
            result-contact-${{ matrix.worker }}.png
            continuity-report.txt
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
