name: Android CMake Offline Bridge

on:
  push:
    branches: [chatgpt/gradle-offline-bridge-20260812]
    paths:
      - '.github/workflows/android-cmake-offline-bridge.yml'
  workflow_dispatch:

jobs:
  package-cmake:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"
          test -f "$ANDROID_HOME/cmake/3.22.1/source.properties"
          cat "$ANDROID_HOME/cmake/3.22.1/source.properties"

      - name: Pack CMake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmake/meta"
          tar -C "$ANDROID_HOME" -cf - cmake/3.22.1 | zstd -T0 -10 -o "$RUNNER_TEMP/cmake/android-cmake-3.22.1.tar.zst"
          sha256sum "$RUNNER_TEMP/cmake/android-cmake-3.22.1.tar.zst" | tee "$RUNNER_TEMP/cmake/meta/archive.sha256"
          du -sh "$ANDROID_HOME/cmake/3.22.1" | tee "$RUNNER_TEMP/cmake/meta/size.txt"

      - name: Upload CMake bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-cmake-3.22.1
          path: |
            ${{ runner.temp }}/cmake/android-cmake-3.22.1.tar.zst
            ${{ runner.temp }}/cmake/meta/
          compression-level: 0
          retention-days: 1
