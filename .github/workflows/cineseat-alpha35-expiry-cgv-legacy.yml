name: Cineseat Alpha35 Expiry CGV Legacy

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA35_BUILD_TRIGGER.txt'
      - 'secure_payload/build_alpha35_expiry_cgv_legacy.sh'
      - 'secure_payload/apply_alpha35_expiry_cgv_legacy.patch.gz.b64.part*'
      - '.github/workflows/cineseat-alpha35-expiry-cgv-legacy.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha35-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current alpha35 request
        uses: actions/checkout@v4

      - name: Preserve and prepare alpha35 inputs
        shell: bash
        run: |
          set -euo pipefail
          cp secure_payload/build_alpha35_expiry_cgv_legacy.sh /tmp/build_alpha35_expiry_cgv_legacy.sh
          cp secure_payload/build_alpha30_auto_seat_design.sh /tmp/build_alpha35_base.sh
          chmod +x /tmp/build_alpha35_expiry_cgv_legacy.sh /tmp/build_alpha35_base.sh
          cat secure_payload/apply_alpha30_auto_seat_design.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/apply_alpha30_auto_seat_design.patch
          cat secure_payload/apply_alpha31_unified_picker_probe.patch.gz.b64 | base64 --decode | gzip --decompress > /tmp/apply_alpha31_unified_picker_probe.patch
          cat secure_payload/apply_alpha32_cgv_inline_megabox.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/apply_alpha32_cgv_inline_megabox.patch
          cat secure_payload/apply_alpha33_seat_cache_fit_cgv.patch.gz.b64.seg* | base64 --decode | gzip --decompress > /tmp/apply_alpha33_seat_cache_fit_cgv.patch
          cat secure_payload/apply_alpha34_cgv_session_capture.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/apply_alpha34_cgv_session_capture.patch
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import glob
          import hashlib

          paths = sorted(glob.glob('secure_payload/apply_alpha35_expiry_cgv_legacy.patch.gz.b64.part*'))
          if not paths:
              raise SystemExit('alpha35 patch chunks missing')
          encoded = ''.join(Path(path).read_text(encoding='utf-8') for path in paths)
          encoded = ''.join(ch for ch in encoded if ch.isalnum() or ch in '+/=')
          print('alpha35 patch chunks:', len(paths), 'base64 chars:', len(encoded))
          print('alpha35 encoded sha256:', hashlib.sha256(encoded.encode()).hexdigest())
          if hashlib.sha256(encoded.encode()).hexdigest() != 'c526cbf6a888f22cef4bdb27b598fcfd2945052cc1323c7e857e525478daded7':
              raise SystemExit('alpha35 base64 aggregate mismatch')
          raw = base64.b64decode(encoded, validate=True)
          Path('/tmp/apply_alpha35_expiry_cgv_legacy.patch').write_bytes(gzip.decompress(raw))
          PY
          echo 'daf4faadeaf2bcf4dce36ce4d3a7322eeb5b908f8c9b6efb08d5cc48cf050a21  /tmp/apply_alpha30_auto_seat_design.patch' | sha256sum -c -
          echo 'bd81901efc6e07ea30f8d9667a608d0a46d5fcefafc9a0a69e2c4550d9311f03  /tmp/apply_alpha31_unified_picker_probe.patch' | sha256sum -c -
          echo '575bacd49ed8187d115c1abe21a0110dd4648247e23d3f811affc08b63d8b84f  /tmp/apply_alpha32_cgv_inline_megabox.patch' | sha256sum -c -
          echo '846ebb0285379e1c8a7c03ae1e5042eeb34fee029cd44d738aa1e172fa884fdc  /tmp/apply_alpha33_seat_cache_fit_cgv.patch' | sha256sum -c -
          echo '89e323c8100933f1a69778b17d6602ac048bdd4d3b244e02478fa8ad4d3075f2  /tmp/apply_alpha34_cgv_session_capture.patch' | sha256sum -c -
          echo '4ceb93306c0b475d5afb80d94db279bf08cdb8ffe8d247aaa458a47a9ceead82  /tmp/apply_alpha35_expiry_cgv_legacy.patch' | sha256sum -c -

      - name: Restore exact successful alpha29 merge and update legacy verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 612f0604d9b23fbd4ce0da7e1a726f2e9e63326b
          git checkout --force 612f0604d9b23fbd4ce0da7e1a726f2e9e63326b
          test "$(git rev-parse HEAD)" = '612f0604d9b23fbd4ce0da7e1a726f2e9e63326b'
          sed -i '/district_filter_wrap/d' secure_payload/build_alpha21_overlay_public.sh

      - name: Restore source and signing decryption key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build, test, sign and verify alpha35
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/build_alpha35_expiry_cgv_legacy.sh
          grep -q "versionCode='55'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.35'" dist/APK-PACKAGE-INFO.txt
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - ended watches are removed at the exact scheduled end, by a 30-second foreground watchdog, and immediately when the app resumes
          - expired cards are also excluded from the visible list before storage cleanup completes
          - additional CGV and shared timetable end-time field aliases are normalized
          - CGV automatic loading now starts with the official legacy mobile QuickResult guest-booking route
          - matching showtime, one-person selection, guest continuation and legacy seat DOM elements are detected automatically
          - the modern official CGV route remains a bounded fallback when the legacy route fails
          - no authentication bypass, token forgery or payment automation is included
          - fixed signing certificate retained for overwrite installation over alpha34
          REPORT

      - name: Upload alpha35 package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha35-expiry-cgv-legacy-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
