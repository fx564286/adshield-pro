name: comfort-route-apk

on:
  push:
    branches: [comfort-route-mvp]
    paths:
      - 'comfort_route_sample/**'
      - '.github/workflows/comfort-route-apk.yml'
      - '.github/copilot-instructions.md'
  pull_request:
    branches: [comfort-route-mvp]
    paths:
      - 'comfort_route_sample/**'
      - '.github/workflows/comfort-route-apk.yml'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Java version
        run: |
          java -version
          javac -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project and apply v0.6.6
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/comfort_route_build
          flutter create \
            --platforms=android \
            --org com.fx564286 \
            --project-name comfort_route_sample \
            /tmp/comfort_route_build
          cp comfort_route_sample/pubspec.yaml /tmp/comfort_route_build/pubspec.yaml
          rm -rf /tmp/comfort_route_build/lib /tmp/comfort_route_build/test
          cp -R comfort_route_sample/lib /tmp/comfort_route_build/lib
          cp -R comfort_route_sample/test /tmp/comfort_route_build/test
          cp comfort_route_sample/lib/main_v05.dart /tmp/comfort_route_build/lib/main.dart
          rm -f /tmp/comfort_route_build/lib/main_v05.dart
          python3 comfort_route_sample/tools/apply_v06.py
          python3 comfort_route_sample/tools/apply_v061_bootstrap.py
          python3 comfort_route_sample/tools/apply_v062.py
          python3 comfort_route_sample/tools/normalize_v062_lints.py
          python3 comfort_route_sample/tools/apply_v063_pleasant_ui.py
          python3 comfort_route_sample/tools/fix_v063_lints.py
          python3 comfort_route_sample/tools/apply_v064_route_modes.py
          python3 comfort_route_sample/tools/fix_v064_review_findings.py
          python3 comfort_route_sample/tools/apply_v065_guidance.py
          python3 comfort_route_sample/tools/fix_v065_review_findings.py
          python3 comfort_route_sample/tools/apply_v066_gps_korean_map.py

          ACTIVITY=/tmp/comfort_route_build/android/app/src/main/kotlin/com/fx564286/comfort_route_sample/MainActivity.kt
          cp comfort_route_sample/android/MainActivity.kt "$ACTIVITY"

          MANIFEST=/tmp/comfort_route_build/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="comfort_route_sample"/android:label="쾌적길"/' "$MANIFEST"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/comfort_route_build/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          query = '''    <queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>\n'''
          if 'android.intent.action.TTS_SERVICE' not in s:
              s = s.replace('</manifest>', query + '</manifest>')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/comfort_route_build/android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('            signingConfig = signingConfigs.getByName("debug")\n', '')
          s = s.replace('        versionCode = flutter.versionCode', '        versionCode = 13')
          s = s.replace('        versionName = flutter.versionName', '        versionName = "0.6.6"')
          p.write_text(s)
          PY
          grep -nE 'signingConfig|versionCode|versionName' /tmp/comfort_route_build/android/app/build.gradle.kts || true
          grep -n 'android.intent.action.TTS_SERVICE' "$MANIFEST"
          grep -n 'TextToSpeech' "$ACTIVITY"

      - name: Analyze
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter pub get
          flutter analyze

      - name: Unit and responsive tests
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter test --no-pub

      - name: Build unsigned release APK
        shell: bash
        working-directory: /tmp/comfort_route_build/android
        run: |
          set -euxo pipefail
          java -version
          javac -version
          ./gradlew assembleRelease --stacktrace
          UNSIGNED="$(find /tmp/comfort_route_build -type f -name '*release*unsigned*.apk' | head -1)"
          test -n "$UNSIGNED"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BUILD_TOOLS_DIR="$(dirname "$APKSIGNER")"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$GITHUB_WORKSPACE/comfort-route-v0.6.6-aligned-unsigned.apk"
          "$ZIPALIGN" -c -v 4 "$GITHUB_WORKSPACE/comfort-route-v0.6.6-aligned-unsigned.apk" | tee "$GITHUB_WORKSPACE/zipalign-check.txt"

          mkdir -p "$GITHUB_WORKSPACE/apksigner-bundle/lib"
          cp "$APKSIGNER" "$GITHUB_WORKSPACE/apksigner-bundle/apksigner"
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" "$GITHUB_WORKSPACE/apksigner-bundle/lib/apksigner.jar"
          chmod +x "$GITHUB_WORKSPACE/apksigner-bundle/apksigner"

      - name: Verify unsigned APK metadata
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/comfort-route-v0.6.6-aligned-unsigned.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt" || true
          "$AAPT" dump permissions "$APK" | tee "$GITHUB_WORKSPACE/apk-permissions.txt" || true
          grep -q "application-label:'쾌적길'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionCode='13'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionName='0.6.6'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "android.permission.INTERNET" "$GITHUB_WORKSPACE/apk-permissions.txt"
          grep -q "android.permission.ACCESS_COARSE_LOCATION" "$GITHUB_WORKSPACE/apk-permissions.txt"
          grep -q "android.permission.ACCESS_FINE_LOCATION" "$GITHUB_WORKSPACE/apk-permissions.txt"
          unzip -l "$APK" | grep -E 'lib/.*/libmaplibre|lib/.*/libc\+\+_shared|lib/.*/libflutter' | tee "$GITHUB_WORKSPACE/native-libs.txt" || true
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/unsigned.sha256"

      - name: Upload unsigned build bundle
        uses: actions/upload-artifact@v4
        with:
          name: comfort-route-v0.6.6-unsigned-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            comfort-route-v0.6.6-aligned-unsigned.apk
            unsigned.sha256
            zipalign-check.txt
            apk-badging.txt
            apk-permissions.txt
            native-libs.txt
            apksigner-bundle/
