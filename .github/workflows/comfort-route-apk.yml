name: comfort-route-apk

on:
  push:
    branches: [comfort-route-mvp]
    paths:
      - 'comfort_route_sample/**'
      - '.github/workflows/comfort-route-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project and copy sample
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/comfort_route_build
          flutter create \
            --platforms=android \
            --org com.fx564286 \
            --project-name comfort_route_sample \
            /tmp/comfort_route_build
          cp comfort_route_sample/pubspec.yaml /tmp/comfort_route_build/pubspec.yaml
          rm -rf /tmp/comfort_route_build/lib
          cp -R comfort_route_sample/lib /tmp/comfort_route_build/lib
          rm -rf /tmp/comfort_route_build/test

      - name: Analyze
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter pub get
          flutter analyze

      - name: Build debug APK
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter build apk --debug --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/comfort-route-sample-v0.2-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/comfort-route-sample-v0.2-debug.apk"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/comfort-route-sample-v0.2-debug.apk.sha256"
          unzip -t "$APK" | tee "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          if [[ "$(basename "$AAPT")" == "aapt" ]]; then
            "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          else
            "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comfort-route-sample-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            comfort-route-sample-v0.2-debug.apk
            comfort-route-sample-v0.2-debug.apk.sha256
            apk-unzip-test.txt
            apk-signature.txt
            apk-badging.txt
