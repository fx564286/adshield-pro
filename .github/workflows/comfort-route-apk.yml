name: comfort-route-apk

on:
  push:
    branches: [comfort-route-mvp]
    paths:
      - 'comfort_route_sample/**'
      - '.github/workflows/comfort-route-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize compact route card source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('comfort_route_sample/lib/main.dart')
          s = p.read_text()
          old = """                const SizedBox(height: AppSpace.xxs),
                Text(
                  '${route.distanceKm.toStringAsFixed(2)} km · ${route.minutes}분',
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: Theme.of(context).textTheme.bodySmall,
                ),
                const SizedBox(height: 2),
                Text(
                  '그늘 ${route.shade}% · 실내 ${route.indoor}%',
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: const TextStyle(
                    fontSize: 11,
                    color: AppColors.textMuted,
                    fontWeight: FontWeight.w600,
                  ),
                ),
"""
          new = """                const SizedBox(height: AppSpace.xxs),
                Text(
                  '${route.distanceKm.toStringAsFixed(2)} km · ${route.minutes}분 · 그늘 ${route.shade}%',
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: Theme.of(context).textTheme.bodySmall,
                ),
"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('COMPACT_ROUTE_FIX_APPLIED')
          else:
              print('COMPACT_ROUTE_FIX_ALREADY_APPLIED')
          PY
          if ! git diff --quiet -- comfort_route_sample/lib/main.dart; then
            git config user.name "comfort-route-ci"
            git config user.email "comfort-route-ci@users.noreply.github.com"
            git add comfort_route_sample/lib/main.dart
            git commit -m "Fix compact route card overflow"
            git push origin HEAD:comfort-route-mvp
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project and copy sample
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/comfort_route_build
          flutter create \
            --platforms=android \
            --org com.fx564286 \
            --project-name comfort_route_sample \
            /tmp/comfort_route_build
          cp comfort_route_sample/pubspec.yaml /tmp/comfort_route_build/pubspec.yaml
          rm -rf /tmp/comfort_route_build/lib /tmp/comfort_route_build/test
          cp -R comfort_route_sample/lib /tmp/comfort_route_build/lib
          cp -R comfort_route_sample/test /tmp/comfort_route_build/test

      - name: Analyze
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter pub get
          flutter analyze

      - name: Responsive widget tests
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter test --no-pub

      - name: Build debug APK
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter build apk --debug --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/comfort-route-sample-v0.3-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/comfort-route-sample-v0.3-debug.apk"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/comfort-route-sample-v0.3-debug.apk.sha256"
          unzip -t "$APK" | tee "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comfort-route-v0.3-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            comfort-route-sample-v0.3-debug.apk
            comfort-route-sample-v0.3-debug.apk.sha256
            apk-unzip-test.txt
            apk-signature.txt
            apk-badging.txt
