name: comfort-route-apk

on:
  push:
    branches: [comfort-route-mvp]
    paths:
      - 'comfort_route_sample/**'
      - '.github/workflows/comfort-route-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project and copy sample
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/comfort_route_build
          flutter create \
            --platforms=android \
            --org com.fx564286 \
            --project-name comfort_route_sample \
            /tmp/comfort_route_build
          cp comfort_route_sample/pubspec.yaml /tmp/comfort_route_build/pubspec.yaml
          rm -rf /tmp/comfort_route_build/lib /tmp/comfort_route_build/test
          cp -R comfort_route_sample/lib /tmp/comfort_route_build/lib
          cp -R comfort_route_sample/test /tmp/comfort_route_build/test

          MANIFEST=/tmp/comfort_route_build/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="comfort_route_sample"/android:label="쾌적길"/' "$MANIFEST"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

          base64 -d comfort_route_sample/signing/dev-keystore.b64 > /tmp/comfort_route_build/android/app/comfort-route-dev-signing.jks

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/comfort_route_build/android/app/build.gradle.kts')
          s = p.read_text()
          anchor = '    buildTypes {'
          block = '''    signingConfigs {\n        create("comfortDev") {\n            storeFile = file("comfort-route-dev-signing.jks")\n            storePassword = "comfort_route_dev_2026"\n            keyAlias = "comfort-route-dev"\n            keyPassword = "comfort_route_dev_2026"\n        }\n    }\n\n'''
          if 'create("comfortDev")' not in s:
              s = s.replace(anchor, block + anchor, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("comfortDev")')
          p.write_text(s)
          PY

          keytool -list -v \
            -storetype JKS \
            -keystore /tmp/comfort_route_build/android/app/comfort-route-dev-signing.jks \
            -storepass comfort_route_dev_2026 \
            -alias comfort-route-dev | tee "$GITHUB_WORKSPACE/signing-key.txt"
          grep -q 'F1:A7:90:6E:13:8A:24:64:47:C4:28:7D:4D:8A:D5:BB:6D:DA:A5:6D:AD:48:BB:3C:BE:4B:6B:76:87:7F:45:81' "$GITHUB_WORKSPACE/signing-key.txt"

      - name: Analyze
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter pub get
          flutter analyze

      - name: Responsive widget tests
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter test --no-pub

      - name: Build fixed-sign release APK
        working-directory: /tmp/comfort_route_build
        run: |
          set -euxo pipefail
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/comfort-route-sample-v0.4.1-fixed-sign.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/comfort-route-sample-v0.4.1-fixed-sign.apk"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/comfort-route-sample-v0.4.1-fixed-sign.apk.sha256"
          unzip -t "$APK" | tee "$GITHUB_WORKSPACE/apk-unzip-test.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt" || true
          "$AAPT" dump permissions "$APK" | tee "$GITHUB_WORKSPACE/apk-permissions.txt" || true
          grep -qi 'f1a7906e138a246447c4287d4d8ad5bb6ddaa56dad48bb3cbe4b6b76877f4581' "$GITHUB_WORKSPACE/apk-signature.txt"
          grep -q "application-label:'쾌적길'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "android.permission.INTERNET" "$GITHUB_WORKSPACE/apk-permissions.txt"
          grep -q "android.permission.ACCESS_COARSE_LOCATION" "$GITHUB_WORKSPACE/apk-permissions.txt"
          grep -q "android.permission.ACCESS_FINE_LOCATION" "$GITHUB_WORKSPACE/apk-permissions.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comfort-route-v0.4.1-fixed-sign-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            comfort-route-sample-v0.4.1-fixed-sign.apk
            comfort-route-sample-v0.4.1-fixed-sign.apk.sha256
            signing-key.txt
            apk-unzip-test.txt
            apk-signature.txt
            apk-badging.txt
            apk-permissions.txt
