name: Cineseat Alpha34 CGV Session Capture

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA34_BUILD_TRIGGER.txt'
      - 'secure_payload/build_alpha34_cgv_session_capture.sh'
      - 'secure_payload/apply_alpha34_cgv_session_capture.patch.gz.b64'
      - '.github/workflows/cineseat-alpha34-cgv-session-capture.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha34-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current alpha34 request
        uses: actions/checkout@v4

      - name: Preserve and prepare alpha34 inputs
        shell: bash
        run: |
          set -euo pipefail
          cp secure_payload/build_alpha34_cgv_session_capture.sh /tmp/build_alpha34_cgv_session_capture.sh
          cp secure_payload/build_alpha30_auto_seat_design.sh /tmp/build_alpha34_base.sh
          chmod +x /tmp/build_alpha34_cgv_session_capture.sh /tmp/build_alpha34_base.sh
          cat secure_payload/apply_alpha30_auto_seat_design.patch.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > /tmp/apply_alpha30_auto_seat_design.patch
          cat secure_payload/apply_alpha31_unified_picker_probe.patch.gz.b64 \
            | base64 --decode | gzip --decompress \
            > /tmp/apply_alpha31_unified_picker_probe.patch
          cat secure_payload/apply_alpha32_cgv_inline_megabox.patch.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > /tmp/apply_alpha32_cgv_inline_megabox.patch
          cat secure_payload/apply_alpha33_seat_cache_fit_cgv.patch.gz.b64.seg* \
            | base64 --decode | gzip --decompress \
            > /tmp/apply_alpha33_seat_cache_fit_cgv.patch
          base64 --decode secure_payload/apply_alpha34_cgv_session_capture.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/apply_alpha34_cgv_session_capture.patch
          echo 'daf4faadeaf2bcf4dce36ce4d3a7322eeb5b908f8c9b6efb08d5cc48cf050a21  /tmp/apply_alpha30_auto_seat_design.patch' | sha256sum -c -
          echo 'bd81901efc6e07ea30f8d9667a608d0a46d5fcefafc9a0a69e2c4550d9311f03  /tmp/apply_alpha31_unified_picker_probe.patch' | sha256sum -c -
          echo '575bacd49ed8187d115c1abe21a0110dd4648247e23d3f811affc08b63d8b84f  /tmp/apply_alpha32_cgv_inline_megabox.patch' | sha256sum -c -
          echo '846ebb0285379e1c8a7c03ae1e5042eeb34fee029cd44d738aa1e172fa884fdc  /tmp/apply_alpha33_seat_cache_fit_cgv.patch' | sha256sum -c -
          echo '89e323c8100933f1a69778b17d6602ac048bdd4d3b244e02478fa8ad4d3075f2  /tmp/apply_alpha34_cgv_session_capture.patch' | sha256sum -c -

      - name: Restore exact successful alpha29 merge and update legacy verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 612f0604d9b23fbd4ce0da7e1a726f2e9e63326b
          git checkout --force 612f0604d9b23fbd4ce0da7e1a726f2e9e63326b
          test "$(git rev-parse HEAD)" = '612f0604d9b23fbd4ce0da7e1a726f2e9e63326b'
          sed -i '/district_filter_wrap/d' secure_payload/build_alpha21_overlay_public.sh

      - name: Restore source and signing decryption key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build, test, sign and verify alpha34
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/build_alpha34_cgv_session_capture.sh
          grep -q "versionCode='54'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.34'" dist/APK-PACKAGE-INFO.txt
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - CGV official API remains the fast first attempt with short bounded timeout
          - a full mobile-size hidden official CGV WebView continues the public non-member route automatically
          - page-originated fetch and XMLHttpRequest seat responses are captured and parsed inside the official session
          - exact seats are also recovered from the rendered DOM and embedded application JSON
          - guest booking controls are advanced only through the seat-selection stage and never through payment
          - when CGV requires personal verification, the user can connect once in the official WebView and reuse that official session
          - no authentication bypass, token forgery or payment automation is included
          - fixed signing certificate retained for overwrite installation over alpha33
          REPORT

      - name: Upload alpha34 package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha34-cgv-session-capture-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
