name: Build Universal Step QA APK

on:
  push:
    branches:
      - chatgpt-universal-step-apk-20260808
    paths:
      - 'universal_step_build/**'
      - '.github/workflows/build-universal-step-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore project
        shell: bash
        run: |
          base64 -d universal_step_build/UniversalStepQATool_source.zip.b64 > /tmp/UniversalStepQATool_source.zip
          rm -rf HuaweiHealthQATool
          unzip -q /tmp/UniversalStepQATool_source.zip

      - name: Build debug APK
        working-directory: HuaweiHealthQATool
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp HuaweiHealthQATool/app/build/outputs/apk/debug/app-debug.apk dist/UniversalStepQATool-debug.apk
          sha256sum dist/UniversalStepQATool-debug.apk | tee dist/UniversalStepQATool-debug.apk.sha256
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalStepQATool-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
