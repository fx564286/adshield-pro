name: Build Universal Step QA APK

on:
  push:
    branches:
      - chatgpt-universal-step-apk-20260808
    paths:
      - 'UniversalStepQATool/**'
      - '.github/workflows/build-universal-step-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: UniversalStepQATool
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK and signing tool
        shell: bash
        run: |
          mkdir -p dist
          cp UniversalStepQATool/app/build/outputs/apk/debug/app-debug.apk dist/UniversalStepQATool-debug.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/UniversalStepQATool-debug.apk | tee dist/UniversalStepQATool-debug.apk.sha256
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalStepQATool-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7
