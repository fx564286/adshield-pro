name: Cineseat Alpha24 Region Condition

on:
  pull_request:
    branches: [cineseat-secure-builder]
    paths:
      - 'secure_payload/ALPHA24_BUILD_TRIGGER.txt'
      - 'secure_payload/apply_alpha24_region_condition.py.gz.b64.part*'
      - '.github/workflows/cineseat-alpha24-region-condition.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: cineseat-alpha24-region-condition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct alpha22 alpha23 and alpha24 patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part00 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part01 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part02 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03a \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part03b \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part04 \
            secure_payload/apply_alpha22_seat_ui_fix.py.gz.b64.part05 \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha22_seat_ui_fix.py
          cat secure_payload/apply_alpha23_ui_cache.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha23_ui_cache.py
          cat secure_payload/apply_alpha24_region_condition.py.gz.b64.part* \
            | base64 --decode | gzip --decompress \
            > secure_payload/apply_alpha24_region_condition.py
          echo 'b83a89872db3221102f872a693eef1f64945a4c5676f9fce073a4df440299c93  secure_payload/apply_alpha24_region_condition.py' | sha256sum -c -
          python3 -m py_compile secure_payload/apply_alpha22_seat_ui_fix.py
          python3 -m py_compile secure_payload/apply_alpha22_booking_helper_fix.py
          python3 -m py_compile secure_payload/apply_alpha23_ui_cache.py
          python3 -m py_compile secure_payload/apply_alpha24_region_condition.py

      - name: Prepare alpha24 stable builder wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('secure_payload/build_alpha21_overlay_v2_public.sh')
          wrapper = source.read_text(encoding='utf-8')
          addon_anchor = 'rm -f "$SOURCE/payload/test/alpha20_runtime_test.dart"\n'
          if addon_anchor not in wrapper:
              raise SystemExit('stable home addon anchor missing')
          wrapper = wrapper.replace(
              addon_anchor,
              addon_anchor +
              'python3 secure_payload/apply_alpha22_seat_ui_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha22_booking_helper_fix.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha23_ui_cache.py "$SOURCE/payload"\n' +
              'python3 secure_payload/apply_alpha24_region_condition.py "$SOURCE/payload"\n' +
              'printf "\\n// Cineseat 0.2.1-alpha.24\\n" >> "$SOURCE/payload/lib/wizard_v4.dart"\n',
              1,
          )

          text_anchor = "text = source.read_text(encoding='utf-8')\n"
          if text_anchor not in wrapper:
              raise SystemExit('underlying builder text anchor missing')
          wrapper = wrapper.replace(
              text_anchor,
              text_anchor +
              "text = text.replace('0.2.1-alpha.21', '0.2.1-alpha.24')\n" +
              "text = text.replace('version: 0.2.1-alpha.24+41', 'version: 0.2.1-alpha.24+44')\n" +
              "text = text.replace('--build-number=41', '--build-number=44')\n" +
              "text = text.replace(\"versionCode='41'\", \"versionCode='44'\")\n" +
              "text = text.replace('Cineseat 0.2.1-alpha.21 validation build', 'Cineseat 0.2.1-alpha.24 validation build')\n" +
              "text = text.replace(\"\\\"Key('district_filter_wrap')\\\",\", \"\\\"Key('region_theater_list')\\\",\")\n" +
              "text = text.replace('if \\\"district_서울_강남구\\\" not in test:', 'if \\\"region_theater_C1\\\" not in test:')\n" +
              "text = text.replace('district selection runtime test is missing', 'two-pane region browser runtime test is missing')\n" +
              "text = text.replace(\"if '0.2.1-alpha.21' not in all_dart:\", \"if '0.2.1-alpha.24' not in all_dart:\")\n" +
              "text = text.replace('alpha21 version marker is missing', 'alpha24 version marker is missing')\n",
              1,
          )
          wrapper = wrapper.replace(
              '/tmp/build_alpha21_overlay_v2_public.sh',
              '/tmp/build_alpha24_overlay_v2_public.sh',
          )
          Path('/tmp/run_alpha24_stable.sh').write_text(wrapper, encoding='utf-8')
          PY
          chmod +x /tmp/run_alpha24_stable.sh

      - name: Restore runner-only RSA key
        uses: actions/cache@v4
        with:
          path: secure_runtime/private.pem
          key: cineseat-secure-builder-key-v1
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Build and verify Cineseat alpha24
        shell: bash
        run: bash /tmp/run_alpha24_stable.sh

      - name: Verify alpha24 source and package
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode='44'" dist/APK-PACKAGE-INFO.txt
          grep -q "versionName='0.2.1-alpha.24'" dist/APK-PACKAGE-INFO.txt
          test -s dist/cineseat-0.2.1-alpha.24-VALIDATION.apk
          unzip -tq dist/cineseat-0.2.1-alpha.24-VALIDATION.apk
          cat >> dist/BUILD_REPORT.txt <<'REPORT'
          - region selection replaced with a custom two-pane browser
          - left pane shows provinces with theater counts in the Cineseat pink style
          - right pane shows theaters directly and supports search, chain, favorites and sorting
          - duplicate theater card list below the region browser was removed
          - cancellation monitoring all/any conditions are separate rounded selectable cards
          - existing alpha23 cache, unified create/edit flow and alpha22 seat map behavior retained
          REPORT

      - name: Upload alpha24 build package
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha24-region-condition-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
