name: Temporary Encrypted Cineseat Alpha27 Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cineseat-alpha26-private-build.yml'
      - 'cineseat_source_chunks/**'
      - 'alpha27_recovery/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  encrypted-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout encrypted build carrier only
        uses: actions/checkout@v4

      - name: Restore PR-scoped decryption key
        id: key-cache
        uses: actions/cache@v4
        with:
          path: .cineseat-key
          key: cineseat-alpha26-pr6-rsa-v1

      - name: Generate ephemeral RSA certificate
        if: steps.key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cineseat-key
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout .cineseat-key/private.pem \
            -out .cineseat-key/cert.pem \
            -days 7 \
            -subj '/CN=CineseatAlpha26Ephemeral/'
          chmod 600 .cineseat-key/private.pem

      - name: Detect encrypted source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          count=$(find cineseat_source_chunks -maxdepth 1 -type f -name 'chunk_*' 2>/dev/null | wc -l)
          if [[ "$count" -eq 7 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "Expected 7 encrypted chunks, found $count." >&2
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.source.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decrypt private source in runner memory
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat cineseat_source_chunks/chunk_* > "$RUNNER_TEMP/cineseat-source.b64"
          base64 --decode "$RUNNER_TEMP/cineseat-source.b64" > "$RUNNER_TEMP/cineseat-source.cms"
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/cineseat-source.cms" \
            -recip .cineseat-key/cert.pem \
            -inkey .cineseat-key/private.pem \
            -out "$RUNNER_TEMP/cineseat-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/cineseat-source"
          tar -xzf "$RUNNER_TEMP/cineseat-source.tar.gz" \
            -C "$RUNNER_TEMP/cineseat-source"
          test -s "$RUNNER_TEMP/cineseat-source/build.sh"
          test -s "$RUNNER_TEMP/cineseat-source/lib/main.dart"

      - name: Reconstruct and apply alpha27 recovery patch
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find alpha27_recovery -maxdepth 1 -type f -name 'chunk_*' | wc -l)" -eq 7
          cat alpha27_recovery/chunk_* > "$RUNNER_TEMP/apply-alpha27.b64"
          base64 --decode "$RUNNER_TEMP/apply-alpha27.b64" > "$RUNNER_TEMP/apply_alpha27.py"
          python3 -m py_compile "$RUNNER_TEMP/apply_alpha27.py"
          python3 "$RUNNER_TEMP/apply_alpha27.py" "$RUNNER_TEMP/cineseat-source"

      - name: Build and verify validation APK
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cineseat-source"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'rm -rf "$APP/lib"\n'
          replacement = 'rm -rf "$APP/lib" "$APP/test"\n'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x build.sh
          bash build.sh

      - name: Upload failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha27-diagnostics"
          if [[ -d "$RUNNER_TEMP/cineseat-source" ]]; then
            grep -R -n -E "label: '감시'|label: '알림'|label: '설정'|region_theater_picker|cineseat_theater_cache_v2|alpha.27" \
              "$RUNNER_TEMP/cineseat-source/lib" \
              > "$RUNNER_TEMP/alpha27-diagnostics/guard-markers.txt" || true
          fi

      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cineseat-alpha27-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/alpha27-diagnostics/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload APK and verification
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cineseat-alpha27-${{ github.run_number }}
          path: ${{ runner.temp }}/cineseat-source/dist/*
          if-no-files-found: error
          retention-days: 1
