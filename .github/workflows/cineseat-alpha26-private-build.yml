name: Temporary Encrypted Cineseat Alpha27 Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cineseat-alpha26-private-build.yml'
      - 'cineseat_alpha27_full_chunks/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  encrypted-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CINESEAT_KEYSTORE_B64: ${{ secrets.CINESEAT_KEYSTORE_B64 }}
      CINESEAT_STORE_PASSWORD: ${{ secrets.CINESEAT_STORE_PASSWORD }}
      CINESEAT_KEY_ALIAS: ${{ secrets.CINESEAT_KEY_ALIAS }}
      CINESEAT_KEY_PASSWORD: ${{ secrets.CINESEAT_KEY_PASSWORD }}
    steps:
      - name: Checkout encrypted build carrier only
        uses: actions/checkout@v4

      - name: Restore PR-scoped decryption key
        uses: actions/cache@v4
        with:
          path: .cineseat-key
          key: cineseat-alpha26-pr6-rsa-v1
          fail-on-cache-miss: true

      - name: Validate encrypted alpha27 source carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(find cineseat_alpha27_full_chunks -maxdepth 1 -type f -name 'chunk_*' | wc -l)" -eq 9
          cat cineseat_alpha27_full_chunks/chunk_* > "$RUNNER_TEMP/alpha27-source.b64"
          echo "ebca1dffe9e225dcf146e0189a84c4c82f3ea343d55bfbdef2c5cfaae8850799  $RUNNER_TEMP/alpha27-source.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/alpha27-source.b64" > "$RUNNER_TEMP/alpha27-source.cms"
          echo "64f369bdd37dd20d5c7fcac0550fb890ccf5536854a8dc7bcb291cf08fcb6c5a  $RUNNER_TEMP/alpha27-source.cms" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decrypt repaired alpha27 source in runner memory
        shell: bash
        run: |
          set -euo pipefail
          test -s .cineseat-key/private.pem
          test -s .cineseat-key/cert.pem
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/alpha27-source.cms" \
            -recip .cineseat-key/cert.pem \
            -inkey .cineseat-key/private.pem \
            -out "$RUNNER_TEMP/alpha27-source.tar.gz"
          echo "ee5473624772e23deda304bc7680d84fa3d671ed5331ce20956860286e9b394f  $RUNNER_TEMP/alpha27-source.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cineseat-alpha27"
          tar -xzf "$RUNNER_TEMP/alpha27-source.tar.gz" -C "$RUNNER_TEMP/cineseat-alpha27"
          test -s "$RUNNER_TEMP/cineseat-alpha27/build.sh"
          test -s "$RUNNER_TEMP/cineseat-alpha27/lib/main.dart"
          test -s "$RUNNER_TEMP/cineseat-alpha27/app_icon.png"

      - name: Verify requested alpha27 feature guards
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$RUNNER_TEMP/cineseat-alpha27/lib/main.dart"
          SERVICE="$RUNNER_TEMP/cineseat-alpha27/android/SeatMonitorService.kt"
          test "$(grep -c 'NavigationDestination(' "$MAIN")" -eq 3
          grep -q "label: '감시'" "$MAIN"
          grep -q "label: '알림'" "$MAIN"
          grep -q "label: '설정'" "$MAIN"
          grep -q 'region_theater_picker' "$MAIN"
          grep -q 'theater_cache_alpha27' "$MAIN"
          grep -q '_emergencyTheaters' "$MAIN"
          grep -q '재부팅 후 감시 복구' "$MAIN"
          grep -q '영화관 캐시 초기화' "$MAIN"
          grep -q '감시할 실제 좌석' "$MAIN"
          grep -q 'endTime: showtime.endTime' "$MAIN"
          ! grep -q "Text('영화관 목록'" "$MAIN"
          ! grep -q '첫 좌석 감시 만들기' "$MAIN"
          grep -q 'loadCgvAvailable' "$SERVICE"
          grep -q 'loadLotteAvailable' "$SERVICE"
          grep -q 'alert_history' "$SERVICE"
          grep -q 'last_available_' "$SERVICE"

      - name: Build and verify validation APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cineseat-alpha27"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.sh')
          text = path.read_text(encoding='utf-8')
          old = "service = Path('android/app/src/main/kotlin/com/fx564286/cinema_seat_alert/SeatMonitorService.kt').read_text(encoding='utf-8')"
          new = "service = (app / 'android/app/src/main/kotlin/com/fx564286/cinema_seat_alert/SeatMonitorService.kt').read_text(encoding='utf-8')"
          if old not in text:
              raise SystemExit('alpha27 native path compatibility marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          chmod +x build.sh
          bash build.sh

      - name: Apply fixed Cineseat signing key when available
        id: fixed-sign
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/cineseat-alpha27/dist"
          VALIDATION="$DIST/cineseat-0.2.1-alpha.27-VALIDATION.apk"
          FINAL="$DIST/Cineseat_0.2.1-alpha.27_fixed-signed.apk"
          STATUS="$DIST/SIGNING-STATUS.txt"
          EXPECTED='CE395C3785CF4FBD959A5E2F9E5BEB3306CCDB82F19A4DAFF89FD634DCFD69F5'
          test -s "$VALIDATION"
          if [[ -z "${CINESEAT_KEYSTORE_B64:-}" || -z "${CINESEAT_STORE_PASSWORD:-}" || -z "${CINESEAT_KEY_ALIAS:-}" || -z "${CINESEAT_KEY_PASSWORD:-}" ]]; then
            printf '%s\n' \
              'fixed_signing_secrets_present=false' \
              'validation_apk_built=true' \
              'overwrite_compatible=false' > "$STATUS"
            echo 'fixed_signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/cineseat-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$CINESEAT_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:CINESEAT_STORE_PASSWORD \
            --ks-key-alias "$CINESEAT_KEY_ALIAS" \
            --key-pass env:CINESEAT_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$VALIDATION"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL" \
            | tee "$DIST/FIXED-APK-SIGNATURE.txt"
          "$TOOLS/zipalign" -c -v 4 "$FINAL"
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$DIST/FIXED-APK-PACKAGE-INFO.txt"
          ACTUAL="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$DIST/FIXED-APK-SIGNATURE.txt" | sed 's/.*: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED"
          grep -q "package: name='com.fx564286.cinema_seat_alert'" "$DIST/FIXED-APK-PACKAGE-INFO.txt"
          grep -q "versionCode='47'" "$DIST/FIXED-APK-PACKAGE-INFO.txt"
          grep -q "versionName='0.2.1-alpha.27'" "$DIST/FIXED-APK-PACKAGE-INFO.txt"
          sha256sum "$FINAL" | tee "$DIST/FIXED-APK-SHA256.txt"
          printf '%s\n' \
            'fixed_signing_secrets_present=true' \
            'fixed_signing_verified=true' \
            'overwrite_compatible=true' \
            "certificate_sha256=$EXPECTED" > "$STATUS"
          echo 'fixed_signed=true' >> "$GITHUB_OUTPUT"

      - name: Upload failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha27-diagnostics"
          if [[ -d "$RUNNER_TEMP/cineseat-alpha27" ]]; then
            find "$RUNNER_TEMP/cineseat-alpha27" -maxdepth 3 -type f -printf '%P\n' | sort \
              > "$RUNNER_TEMP/alpha27-diagnostics/source-files.txt"
            grep -R -n -E "error:|Error:|FAILURE:|label: '감시'|label: '알림'|label: '설정'|region_theater_picker|alpha.27" \
              "$RUNNER_TEMP/cineseat-alpha27" \
              > "$RUNNER_TEMP/alpha27-diagnostics/guard-markers.txt" || true
          fi

      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cineseat-alpha27-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/alpha27-diagnostics/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload APK and verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cineseat-alpha27-${{ github.run_number }}
          path: ${{ runner.temp }}/cineseat-alpha27/dist/*
          if-no-files-found: error
          retention-days: 7
