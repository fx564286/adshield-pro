name: Temporary Encrypted Cineseat Alpha27 Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cineseat-alpha26-private-build.yml'
      - 'alpha27_final_source/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  encrypted-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout encrypted build carrier only
        uses: actions/checkout@v4

      - name: Restore PR-scoped decryption key
        uses: actions/cache@v4
        with:
          path: .cineseat-key
          key: cineseat-alpha26-pr6-rsa-v1
          fail-on-cache-miss: true

      - name: Validate encrypted alpha27 source carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(find alpha27_final_source -maxdepth 1 -type f -name 'chunk_*' | wc -l)" -eq 5
          cat alpha27_final_source/chunk_* > "$RUNNER_TEMP/alpha27-source.b64"
          echo "ebca1dffe9e225dcf146e0189a84c4c82f3ea343d55bfbdef2c5cfaae8850799  $RUNNER_TEMP/alpha27-source.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/alpha27-source.b64" > "$RUNNER_TEMP/alpha27-source.cms"
          echo "64f369bdd37dd20d5c7fcac0550fb890ccf5536854a8dc7bcb291cf08fcb6c5a  $RUNNER_TEMP/alpha27-source.cms" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decrypt repaired alpha27 source in runner memory
        shell: bash
        run: |
          set -euo pipefail
          test -s .cineseat-key/private.pem
          test -s .cineseat-key/cert.pem
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/alpha27-source.cms" \
            -recip .cineseat-key/cert.pem \
            -inkey .cineseat-key/private.pem \
            -out "$RUNNER_TEMP/alpha27-source.tar.gz"
          echo "ee5473624772e23deda304bc7680d84fa3d671ed5331ce20956860286e9b394f  $RUNNER_TEMP/alpha27-source.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cineseat-alpha27"
          tar -xzf "$RUNNER_TEMP/alpha27-source.tar.gz" -C "$RUNNER_TEMP/cineseat-alpha27"
          test -s "$RUNNER_TEMP/cineseat-alpha27/build.sh"
          test -s "$RUNNER_TEMP/cineseat-alpha27/lib/main.dart"
          test -s "$RUNNER_TEMP/cineseat-alpha27/app_icon.png"

      - name: Verify requested alpha27 feature guards
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$RUNNER_TEMP/cineseat-alpha27/lib/main.dart"
          SERVICE="$RUNNER_TEMP/cineseat-alpha27/android/SeatMonitorService.kt"
          test "$(grep -c 'NavigationDestination(' "$MAIN")" -eq 3
          grep -q "label: '감시'" "$MAIN"
          grep -q "label: '알림'" "$MAIN"
          grep -q "label: '설정'" "$MAIN"
          grep -q 'region_theater_picker' "$MAIN"
          grep -q 'theater_cache_alpha27' "$MAIN"
          grep -q '_emergencyTheaters' "$MAIN"
          grep -q '재부팅 후 감시 복구' "$MAIN"
          grep -q '영화관 캐시 초기화' "$MAIN"
          grep -q '감시할 실제 좌석' "$MAIN"
          ! grep -q "Text('영화관 목록'" "$MAIN"
          ! grep -q '첫 좌석 감시 만들기' "$MAIN"
          grep -q 'loadCgvAvailable' "$SERVICE"
          grep -q 'loadLotteAvailable' "$SERVICE"
          grep -q 'alert_history' "$SERVICE"
          grep -q 'last_available_' "$SERVICE"

      - name: Build and verify validation APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cineseat-alpha27"
          chmod +x build.sh
          bash build.sh

      - name: Upload failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alpha27-diagnostics"
          if [[ -d "$RUNNER_TEMP/cineseat-alpha27" ]]; then
            find "$RUNNER_TEMP/cineseat-alpha27" -maxdepth 3 -type f -printf '%P\n' | sort \
              > "$RUNNER_TEMP/alpha27-diagnostics/source-files.txt"
            grep -R -n -E "error:|label: '감시'|label: '알림'|label: '설정'|region_theater_picker|alpha.27" \
              "$RUNNER_TEMP/cineseat-alpha27" \
              > "$RUNNER_TEMP/alpha27-diagnostics/guard-markers.txt" || true
          fi

      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cineseat-alpha27-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/alpha27-diagnostics/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cineseat-alpha27-${{ github.run_number }}
          path: ${{ runner.temp }}/cineseat-alpha27/dist/*
          if-no-files-found: error
          retention-days: 1
