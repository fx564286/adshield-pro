name: Android NDK Offline Bridge

on:
  push:
    branches: [chatgpt/gradle-offline-bridge-20260812]
    paths:
      - '.github/workflows/android-ndk-offline-bridge.yml'
  workflow_dispatch:

jobs:
  package-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Pack and split NDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk-pack/parts" "$RUNNER_TEMP/ndk-pack/meta"
          tar -C "$ANDROID_HOME" -cf - ndk/28.2.13676358 | zstd -T0 -10 -o "$RUNNER_TEMP/ndk-pack/android-ndk-28.2.13676358.tar.zst"
          sha256sum "$RUNNER_TEMP/ndk-pack/android-ndk-28.2.13676358.tar.zst" | tee "$RUNNER_TEMP/ndk-pack/meta/archive.sha256"
          split -b 180M -d -a 2 "$RUNNER_TEMP/ndk-pack/android-ndk-28.2.13676358.tar.zst" "$RUNNER_TEMP/ndk-pack/parts/android-ndk.part-"
          sha256sum "$RUNNER_TEMP/ndk-pack/parts"/* | tee "$RUNNER_TEMP/ndk-pack/meta/parts.sha256"
          du -sh "$ANDROID_HOME/ndk/28.2.13676358" | tee "$RUNNER_TEMP/ndk-pack/meta/installed-size.txt"
          ls -lh "$RUNNER_TEMP/ndk-pack/parts" | tee "$RUNNER_TEMP/ndk-pack/meta/parts-ls.txt"

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-metadata
          path: ${{ runner.temp }}/ndk-pack/meta/
          retention-days: 1

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-00
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-01
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-02
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-03
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-04
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-05
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-06
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-part-07
          path: ${{ runner.temp }}/ndk-pack/parts/android-ndk.part-07
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
