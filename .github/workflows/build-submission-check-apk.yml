name: Build Submission Checklist APK

on:
  push:
    branches:
      - submission-check-apk-build
    paths:
      - 'submission-check-apk/**'
      - '.github/workflows/build-submission-check-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: submission-check-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp submission-check-apk/app/build/outputs/apk/debug/app-debug.apk submission-check.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: submission-check-apk
          path: submission-check.apk
          if-no-files-found: error
          retention-days: 7
